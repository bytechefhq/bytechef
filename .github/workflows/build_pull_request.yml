# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: CI Build on PULL Request

on:
  pull_request:
    branches: [ "master" ]

env:
  BYTECHEF_TEST_FTP_HOST_IP: ${{ secrets.BYTECHEF_TEST_FTP_HOST_IP }}
  BYTECHEF_TEST_FTP_PASSWORD: ${{ secrets.BYTECHEF_TEST_FTP_PASSWORD }}
  BYTECHEF_TEST_FTP_USERNAME: ${{ secrets.BYTECHEF_TEST_FTP_USERNAME }}

permissions:
  contents: read

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from the filter step
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      client: ${{ steps.filter.outputs.client }}
      sdk_app: ${{ steps.filter.outputs.sdk_app }}
      embedded-sdk: ${{ steps.filter.outputs.embedded-sdk }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      # For pull requests, it's not necessary to check out the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            cli:
            - 'cli/**'
            client:
              - 'client/**'
            sdk_app:
              - 'sdks/frontend/automation/app/**'
              - 'server/ee/libs/automation/automation-app/automation-app-public-rest/openapi.yaml'
            embedded-sdk:
              - 'sdks/frontend/embedded/**'
            server:
              - 'server/**'

  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          version: '25.2.4'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: cli
        run: ../gradlew build jacocoTestReport sonar --stacktrace

  client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: run npm commands
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        working-directory: client
        run: |
          npm ci
          npm run check
          npm run build
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: client/

  sdk-app:
    needs: changes
    if: ${{ needs.changes.outputs.sdk_app == 'true' }}
    runs-on: ubuntu-latest
    env:
      BYTECHEF_APP_KEY: sk-ci-canary-4b9e
      BYTECHEF_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sdks/frontend/automation/app/package-lock.json
      - name: Check, build and verify the app SDK
        working-directory: sdks/frontend/automation/app
        run: |
          npm ci
          npm run format
          npm run check:all
          npm run build:all
          npm run check:test-app
          npm run check:template

  embedded-sdk:
    needs: changes
    if: ${{ needs.changes.outputs.embedded-sdk == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sdks/frontend/embedded/package-lock.json
      - name: Install workspace dependencies
        working-directory: sdks/frontend/embedded
        run: npm ci
      - name: run npm commands
        working-directory: sdks/frontend/embedded/library
        run: |
          npm run lint
          npm run typecheck
          npm run test -- --run

  server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
    - name: Set up GraalVM for JDK 25
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: 'graalvm-community'
        java-version: '25'
        version: '25.2.4'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle
    - name: Build and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_ACTIONS_BUILD: true
      working-directory: server
      run: ../gradlew check jacocoTestReport sonar --scan --stacktrace
