x-bytechef-environment: &bytechef-environment
  BYTECHEF_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  BYTECHEF_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bytechef
  BYTECHEF_DATASOURCE_USERNAME: postgres
  BYTECHEF_EDITION: ${BYTECHEF_EDITION:-ce}
  BYTECHEF_ENCRYPTION_PROPERTY_KEY: ${BYTECHEF_ENCRYPTION_KEY:?Set BYTECHEF_ENCRYPTION_KEY, e.g. openssl rand -base64 16}
  BYTECHEF_ENCRYPTION_PROVIDER: property
  BYTECHEF_FEATURE_FLAGS: ${BYTECHEF_FEATURE_FLAGS:-}
  BYTECHEF_FILE_STORAGE_FILESYSTEM_BASEDIR: /opt/bytechef/data/file-storage
  BYTECHEF_FILE_STORAGE_PROVIDER: filesystem
  BYTECHEF_MESSAGE_BROKER_PROVIDER: ${BYTECHEF_MESSAGE_BROKER_PROVIDER:-amqp}
  BYTECHEF_PUBLIC_URL: ${BYTECHEF_PUBLIC_URL:-http://localhost:8080}
  BYTECHEF_RABBITMQ_HOST: rabbitmq
  BYTECHEF_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
  BYTECHEF_RABBITMQ_PORT: 5672
  BYTECHEF_RABBITMQ_USERNAME: bytechef
  BYTECHEF_REDIS_HOST: redis
  BYTECHEF_REDIS_PORT: 6379
  BYTECHEF_SCHEDULER_QUARTZ_CLUSTERED: "true"
  BYTECHEF_SECURITY_REMEMBER_ME_KEY: ${BYTECHEF_SECURITY_REMEMBER_ME_KEY:?Set BYTECHEF_SECURITY_REMEMBER_ME_KEY}
  BYTECHEF_SESSION_STORE: ${BYTECHEF_SESSION_STORE:-redis}
  BYTECHEF_TENANT_MODE: ${BYTECHEF_TENANT_MODE:-single}
  BYTECHEF_UPGRADE_ENABLED: "false"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

x-bytechef-node: &bytechef-node
  image: ${BYTECHEF_IMAGE:-docker.bytechef.io/bytechef/bytechef:latest}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: [ "CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness" ]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s
  mem_limit: 2g
  volumes:
    - file-storage:/opt/bytechef/data/file-storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bytechef
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_USER: bytechef
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 20
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  redis:
    image: redis:8-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${BYTECHEF_IMAGE:-docker.bytechef.io/bytechef/bytechef:latest}
    command: [ "liquibase" ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *bytechef-environment
      BYTECHEF_UPGRADE_ENABLED: "true"

  coordinator:
    <<: *bytechef-node
    deploy:
      replicas: ${BYTECHEF_COORDINATORS:-1}
    environment:
      <<: *bytechef-environment
      BYTECHEF_COORDINATOR_ENABLED: "true"
      BYTECHEF_WEBHOOK_ENABLED: ${BYTECHEF_COORDINATOR_WEBHOOKS:-true}
      BYTECHEF_WORKER_ENABLED: "false"

  worker:
    <<: *bytechef-node
    deploy:
      replicas: ${BYTECHEF_WORKERS:-3}
    environment:
      <<: *bytechef-environment
      BYTECHEF_COORDINATOR_ENABLED: "false"
      BYTECHEF_WEBHOOK_ENABLED: "false"
      BYTECHEF_WORKER_ENABLED: "true"

  webhook:
    <<: *bytechef-node
    deploy:
      replicas: ${BYTECHEF_WEBHOOKS:-0}
    environment:
      <<: *bytechef-environment
      BYTECHEF_COORDINATOR_ENABLED: "false"
      BYTECHEF_WEBHOOK_ENABLED: "true"
      BYTECHEF_WORKER_ENABLED: "false"

  load-balancer:
    image: nginx:1.29-alpine
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "${BYTECHEF_PORT:-8080}:80"

configs:
  nginx:
    content: |
      resolver 127.0.0.11 valid=10s;

      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      '';
      }

      upstream coordinators {
        zone coordinators 64k;
        server coordinator:8080 resolve max_fails=1 fail_timeout=10s;
      }

      upstream webhooks {
        zone webhooks 64k;
        server webhook:8080 resolve max_fails=1 fail_timeout=10s;
        server coordinator:8080 resolve backup max_fails=1 fail_timeout=10s;
      }

      server {
        listen 80;
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;

        location ~ ^/webhooks/[^/]+/test/ {
          proxy_pass http://coordinators;
          proxy_connect_timeout 2s;
          proxy_next_upstream error timeout http_502 http_503;
          proxy_next_upstream_tries 2;
          proxy_set_header Connection "";
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Real-IP $$remote_addr;
        }

        location ~ ^/(webhooks|callback|approvals|job/resume|file-entries/[^/]+/content) {
          proxy_pass http://webhooks;
          proxy_connect_timeout 2s;
          proxy_next_upstream error timeout http_502 http_503;
          proxy_next_upstream_tries 2;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Host $$host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Real-IP $$remote_addr;
        }

        location / {
          proxy_pass http://coordinators;
          proxy_connect_timeout 2s;
          proxy_next_upstream error timeout http_502 http_503;
          proxy_next_upstream_tries 2;
          proxy_set_header Connection "";
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Real-IP $$remote_addr;
        }
      }

volumes:
  file-storage:
    driver: local
  postgres:
    driver: local
