bytechefVersion=0.32.1-SNAPSHOT
bytechefImageVersion=0.32.1-SNAPSHOT

## below are some of the gradle performance improvement settings that can be used as required, these are not enabled by default

## The Gradle daemon aims to improve the startup and execution time of Gradle.
## The daemon is enabled by default in Gradle 3+ setting this to false will disable this.
## https://docs.gradle.org/current/userguide/gradle_daemon.html#sec:ways_to_disable_gradle_daemon
## uncomment the below line to disable the daemon

#org.gradle.daemon=false

## Specifies the JVM arguments used for the daemon process.
## The setting is particularly useful for tweaking memory settings.
## Default value: -Xmx1024m
## uncomment the below line to override the daemon defaults
##
## -Xmx8192m: a whole-repo `./gradlew check` exhausted the previous 4096m and failed
## :generateGitProperties in server-app, worker-app, configuration-app and scheduler-app with
## "Java heap space". This is a ceiling, not a reservation -- only a whole-repo check approaches it.
## For scale: 812 subprojects, and with org.gradle.parallel=true Gradle runs up to max-workers tasks
## at once. Checkstyle/PMD/SpotBugs each fork their own -Xmx512m worker processes, so what fills the
## daemon heap is Gradle's own state (project models, the task graph, in-process javac) plus the
## check-only work: Spotless/google-java-format and test-result + JaCoCo report aggregation.
## Heap dumps land in the repo root and are gitignored (*.hprof).

org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  -Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

## When configured, Gradle will run in incubating parallel mode.
## This propertyOption should only be used with decoupled projects. More details, visit
## https://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
## uncomment the below line to enable parallel mode

org.gradle.parallel=true

## Enables new incubating mode that makes Gradle selective when configuring projects.
## Only relevant projects are configured which results in faster builds for large multi-projects.
## https://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:configuration_on_demand
## uncomment the below line to enable the selective mode

#org.gradle.configureondemand=true

##

org.gradle.caching = true

##

org.gradle.vfs.watch = true

## =============================================================================
## INTELLIJ FAST STARTUP
## =============================================================================

## Fast dev startup: present ALL bytechef library + component modules to IntelliJ as pre-built JARs
## instead of exploded module output directories. The app then loads them in a single base classloader,
## so ServiceLoader reads JAR manifests (fast) instead of scanning hundreds of directories (slow), and
## there is no Spring DevTools base/restart classloader split (which otherwise causes
## NoClassDefFoundError/ServiceConfigurationError when only some modules are JARs).
##
## Trade-off: DevTools still hot-reloads server-app's own code, but library modules (now JARs) no longer
## hot-reload -- edit a library, then re-run buildModuleJars and restart (or use IntelliJ HotSwap for
## method-body edits).
##
## Usage:
##   1. Set fastStartup=true
##   2. Build JARs: ./gradlew -PfastStartup=true :server:apps:server-app:buildModuleJars --parallel
##   3. Refresh Gradle in IntelliJ, then run server-app
##
## Alternative with no prebuild step: set IntelliJ "Build and run using: Gradle" -- bootRun uses the
## resolved runtimeClasspath, which already yields JARs for all modules.
fastStartup=false
## Deprecated alias for fastStartup (kept for back-compat; prefer fastStartup):
#useComponentJars=false

## =============================================================================
## COMPONENT FILTERING - TRUE EXCLUSION (components not loaded at all)
## =============================================================================
## These control which component JARs are included in the classpath.
## Components NOT in the classpath won't be discovered by ServiceLoader.
##
## includeComponents: WHITELIST - only load these components (comma-separated)
## excludeComponents: BLACKLIST - load all EXCEPT these (comma-separated)
##
## Component names = directory name under server/libs/modules/components/
## Examples: slack, github, http-client, script, salesforce, shopify
##
## EXAMPLES:
##
## Load ONLY 5 essential components (fastest startup):
#includeComponents=http-client,script,var,data-mapper,logger
##
## Load all EXCEPT heavy/unused ones:
#excludeComponents=salesforce,hubspot,shopify,wooCommerce,bigCommerce,amazonBedrock,stabilityAi
##
## Minimal set for testing workflows:
#includeComponents=http-client,script,var,data-mapper,logger,json-file,csv-file,xml-file
##
## =============================================================================

## Uncomment ONE of these (or leave both commented to load all ~174 components):
#includeComponents=http-client,script,var,data-mapper,logger
#excludeComponents=
