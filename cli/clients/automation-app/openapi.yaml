---
openapi: "3.0.1"
info:
  title: "The Automation App Management Public V1 API"
  version: "1"
servers:
  - url: "/api/automation/v1"
tags:
  - name: "app"
    description: "The Automation App Management Public API"
  - name: "app-instance"
    description: "The Automation App Instance Management Public API"
  - name: "app-deployment"
    description: "The Automation App Version and Deployment Management Public API"
  - name: "app-api-collection-binding"
    description: "The Automation App API Collection Binding Management Public API"
  - name: "app-workflow-binding"
    description: "The Automation App Workflow Binding Management Public API"
  - name: "workspace-connection"
    description: "The Automation Workspace Connection Management Public API"
paths:
  /apps:
    get:
      description: "Get the apps of a workspace. Each app lists only its instances in the request's environment."
      summary: "Get apps"
      tags:
        - "app"
      operationId: "getApps"
      security:
        - bearerAuth: []
      parameters:
        - name: "workspaceId"
          description: "The id of a workspace."
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: "The apps."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    post:
      description: "Create an app and its first instance in the request's environment. The response carries the instance's secret key, which is shown only once. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Create an app"
      tags:
        - "app"
      operationId: "createApp"
      security:
        - bearerAuth: []
      parameters:
        - name: "workspaceId"
          description: "The id of a workspace."
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: "The first instance of the created app and its secret key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceSecretKey"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /apps/component-operations:
    get:
      description: "Get the names of the actions and agent tools a component version offers: the values the allow-lists of a connection binding accept."
      summary: "Get the operations of a component"
      tags:
        - "app"
      operationId: "getAppComponentOperations"
      security:
        - bearerAuth: []
      parameters:
        - name: "componentName"
          description: "The name of a component."
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "componentVersion"
          description: "The version of the component."
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "The names of the component's actions and agent tools."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppComponentOperations"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /apps/{id}:
    get:
      description: "Get an app by id. It lists only its instances in the request's environment."
      summary: "Get an app"
      tags:
        - "app"
      operationId: "getApp"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: "The app."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    patch:
      description: "Update an app. Fields that are absent keep their stored value; an empty description clears it. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Update an app"
      tags:
        - "app"
      operationId: "updateApp"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdate"
      responses:
        "200":
          description: "The updated app."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    delete:
      description: "Delete an app together with its instances and their bindings. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Delete an app"
      tags:
        - "app"
      operationId: "deleteApp"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      responses:
        "204":
          description: "The app was deleted."
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /apps/{id}/status:
    put:
      description: "Change the status of an app. Suspending or archiving it stops every instance. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Change the status of an app"
      tags:
        - "app"
      operationId: "updateAppStatus"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStatusUpdate"
      responses:
        "200":
          description: "The updated app."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /apps/{id}/instances:
    get:
      description: "Get the instances of an app in the request's environment."
      summary: "Get the instances of an app"
      tags:
        - "app-instance"
      operationId: "getAppInstances"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: "The instances."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    post:
      description: "Create an instance of an app in a workspace in the request's environment. The response carries the instance's secret key, which is shown only once. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Create an instance of an app"
      tags:
        - "app-instance"
      operationId: "createAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstanceInput"
      responses:
        "201":
          description: "The created instance and its secret key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceSecretKey"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /apps/{id}/versions:
    get:
      description: "Get the newest versions of an app, newest first, at most limit of them. A version belongs to the\
        \ app, not to an environment, so the list is the same in every environment. With name, the list holds only\
        \ the version of that name, or nothing."
      summary: "Get the versions of an app"
      tags:
        - "app-deployment"
      operationId: "getAppVersions"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/limit"
        - name: "name"
          description: "The name of the one version to return. Leading and trailing whitespace is ignored."
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 256
      responses:
        "200":
          description: "The versions."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AppVersion"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    post:
      description: "Create a version of an app: a name for code that ByteChef does not hold, such as a release number\
        \ or a short commit hash. Allowed in every environment. A name the app already has answers 409\
        \ APP_VERSION_NAME_ALREADY_EXISTS. Blank optional fields are stored as absent."
      summary: "Create a version of an app"
      tags:
        - "app-deployment"
      operationId: "createAppVersion"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppVersionInput"
      responses:
        "201":
          description: "The created version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersion"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}:
    get:
      description: "Get an app instance by id."
      summary: "Get an app instance"
      tags:
        - "app-instance"
      operationId: "getAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: "The instance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    patch:
      description: "Update an app instance. Fields that are absent keep their stored value; an empty url clears it. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Update an app instance"
      tags:
        - "app-instance"
      operationId: "updateAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstanceUpdate"
      responses:
        "200":
          description: "The updated instance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    delete:
      description: "Delete an app instance together with its bindings. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Delete an app instance"
      tags:
        - "app-instance"
      operationId: "deleteAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      responses:
        "204":
          description: "The instance was deleted."
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/status:
    put:
      description: "Change the status of an app instance. TERMINATED is final and removes the instance's bindings. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Change the status of an app instance"
      tags:
        - "app-instance"
      operationId: "updateAppInstanceStatus"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstanceStatusUpdate"
      responses:
        "200":
          description: "The updated instance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/user-auth:
    put:
      description: "Change whether the app instance signs its users in. Any mode but NONE needs the authorization\
        \ server and answers 409 APP_USER_AUTH_UNAVAILABLE without it. An instance with a url gets its OAuth2 client\
        \ when sign-in is turned on and loses it when sign-in is turned off. Allowed only in DEVELOPMENT: in STAGING\
        \ and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Change the sign-in mode of an app instance"
      tags:
        - "app-instance"
      operationId: "updateAppInstanceUserAuth"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstanceUserAuthUpdate"
      responses:
        "200":
          description: "The updated instance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/secret-key:
    post:
      description: "Rotate the secret key of an app instance. The previous key stops working. The new key is shown only once. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403 APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Rotate the secret key of an app instance"
      tags:
        - "app-instance"
      operationId: "rotateAppInstanceSecretKey"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: "The instance and its new secret key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceSecretKey"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/deployment-settings:
    put:
      description: "Set the connection and the settings the deployment provider of the app instance's hosting target\
        \ uses: a Vercel connection with projectId, repository and an optional target and teamId for VERCEL, an HTTP\
        \ Client connection with deployUrl and optional statusUrl and cancelUrl for SELF_HOSTED. The connection must be\
        \ one the instance could bind and the provider must accept the settings, otherwise 400\
        \ APP_DEPLOYMENT_SETTINGS_INVALID. An absent connectionId with absent or empty settings clears both; an absent\
        \ connectionId with settings answers 400. Allowed only in DEVELOPMENT: in STAGING and PRODUCTION it answers 403\
        \ APP_OPERATION_DEVELOPMENT_ONLY."
      summary: "Set the deployment connection and settings of an app instance"
      tags:
        - "app-instance"
      operationId: "updateAppInstanceDeploymentSettings"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstanceDeploymentSettingsUpdate"
      responses:
        "200":
          description: "The updated instance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/deploy:
    post:
      description: "Ask the deployment provider of the app instance's hosting target to build and release a version of\
        \ the app. The deployment starts QUEUED and reaches READY, FAILED or CANCELED later; poll it. Allowed in every\
        \ environment. A version of another app answers 404 APP_VERSION_NOT_FOUND. No provider for the hosting target\
        \ or no deployment connection answers 409 APP_DEPLOYMENT_PROVIDER_UNAVAILABLE, another deployment in progress\
        \ 409 APP_DEPLOYMENT_IN_PROGRESS and a terminated instance 409 APP_INSTANCE_TERMINATED."
      summary: "Deploy a version to an app instance"
      tags:
        - "app-deployment"
      operationId: "deployAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDeploymentTriggerInput"
      responses:
        "201":
          description: "The deployment, QUEUED or BUILDING, or FAILED when the provider could not start it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDeployment"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/rollback:
    post:
      description: "Deploy again, as a new deployment, a version that was once READY on the app instance. Allowed in every\
        \ environment. A version that was never READY on the instance, or one of another app, answers 404\
        \ APP_VERSION_NOT_FOUND; the other errors are those of deploying."
      summary: "Roll an app instance back to a version"
      tags:
        - "app-deployment"
      operationId: "rollbackAppInstance"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDeploymentTriggerInput"
      responses:
        "201":
          description: "The deployment, QUEUED or BUILDING, or FAILED when the provider could not start it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDeployment"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/deployments:
    get:
      description: "Get the newest recorded deployments of an app instance, newest first, at most limit of them.\
        \ The history is kept after the instance is terminated."
      summary: "Get the deployments of an app instance"
      tags:
        - "app-deployment"
      operationId: "getAppInstanceDeployments"
