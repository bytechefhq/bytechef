              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AppDeployment"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
    post:
      description: "Record that a version of the app was deployed to this instance by someone other than ByteChef,\
        \ such as a CI job. The deployment is READY and becomes the instance's current one. The version is found by\
        \ name or created; a version name that exists with another commit answers 409 APP_VERSION_COMMIT_MISMATCH.\
        \ Allowed in every environment. A blank url or gitCommitSha counts as absent; a url that is not an absolute\
        \ http or https URL answers 400 APP_DEPLOYMENT_URL_INVALID. A terminated instance answers 409\
        \ APP_INSTANCE_TERMINATED."
      summary: "Record a deployment of an app instance"
      tags:
        - "app-deployment"
      operationId: "recordAppInstanceDeployment"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/appInstanceId"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDeploymentRecordInput"
      responses:
        "201":
          description: "The recorded deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDeployment"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "500":
          $ref: "#/components/responses/internalServerError"
  /app-instances/{id}/deployments/{deploymentId}:
    get:
      description: "Get one deployment of an app instance. A deployment of another instance is not found."
      summary: "Get a deployment of an app instance"
