    post:
      description: "Stop a deployment that is QUEUED or BUILDING and mark it CANCELED. When the instance's deployment\
        \ connection no longer belongs to the provider's component, the deployment is canceled without asking the\
        \ provider. Allowed in every environment. A deployment of another instance answers 404\
        \ APP_DEPLOYMENT_NOT_FOUND, a READY, FAILED or CANCELED one 409 APP_DEPLOYMENT_TERMINAL, and a provider that\
        \ refuses the cancel 502 APP_DEPLOYMENT_PROVIDER_FAILED."
      summary: "Cancel a deployment of an app instance"
      tags:
        - "app-deployment"
      operationId: "cancelAppInstanceDeployment"
