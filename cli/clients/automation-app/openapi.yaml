components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    environment:
      name: "X-Environment"
      description: "The environment of the request, the one the API key authenticated in. Defaults to PRODUCTION.\
        \ An app instance of another environment is not found."
      in: "header"
      required: false
      schema:
        $ref: "#/components/schemas/Environment"
    apiCollectionId:
      name: "apiCollectionId"
      description: "The id of an API collection."
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    appId:
      name: "id"
      description: "The id of an app."
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    appInstanceId:
      name: "id"
      description: "The id of an app instance."
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    deploymentId:
      name: "deploymentId"
      description: "The id of an app deployment."
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    limit:
      name: "limit"
      description: "The most items to return, from 1 to 200. Defaults to 50. A value outside that range answers 400\
        \ APP_LIST_LIMIT_INVALID."
      in: "query"
      required: false
      schema:
        type: "integer"
        format: "int32"
        default: 50
    bindingKey:
      name: "bindingKey"
      description: "The binding key, matching ^[a-z][a-z0-9_-]{0,63}$."
      in: "path"
      required: true
      schema:
        type: "string"
    workflowKey:
      name: "workflowKey"
      description: "The workflow key, matching ^[a-z][a-z0-9_-]{0,63}$."
      in: "path"
      required: true
      schema:
        type: "string"
  responses:
    badRequest:
      description: "Bad request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unauthorized:
      description: "Unauthorized"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    forbidden:
      description: "Forbidden"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    notFound:
      description: "Not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    conflict:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    badGateway:
      description: "The hosting provider failed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    internalServerError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Environment:
      description: "The environment."
      type: "string"
      enum:
        - "DEVELOPMENT"
        - "STAGING"
        - "PRODUCTION"
    Error:
      description: "An error. The code names the error; the message describes it."
      type: "object"
      properties:
        code:
          description: "The name of the error."
          type: "string"
        message:
          description: "A description of the error."
          type: "string"
    AppStatus:
      description: "The status of an app. A suspended or archived app rejects every call made with the secret key\
        \ of any of its instances."
      type: "string"
      enum:
        - "DRAFT"
        - "ACTIVE"
        - "SUSPENDED"
        - "ARCHIVED"
    AppInstanceStatus:
      description: "The status of an app instance. A suspended or terminated instance rejects every call made with\
        \ its secret key; TERMINATED is final."
      type: "string"
      enum:
        - "ACTIVE"
        - "SUSPENDED"
        - "TERMINATED"
    AppHostingTarget:
      description: "Where the app instance is hosted."
      type: "string"
      enum:
        - "VERCEL"
        - "SELF_HOSTED"
    AppUserAuthMode:
      description: "Whether the app instance signs its users in."
      type: "string"
      enum:
        - "NONE"
        - "OPTIONAL"
        - "REQUIRED"
    AppVisibility:
      description: "Who can see the app or the app instance. Neither supports every visibility."
      type: "string"
      enum:
        - "PRIVATE"
        - "WORKSPACE"
        - "ORGANIZATION"
    App:
      description: "An app. It lists the instances of the request's environment the caller may see, and the instances\
        \ of that environment that live in other workspaces as reduced rows."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        uuid:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        workspaceId:
          type: "integer"
          format: "int64"
        ownerUserId:
          type: "integer"
          format: "int64"
        categoryId:
          type: "integer"
          format: "int64"
        hasIcon:
          description: "Whether the app has an icon. The image itself is served to signed-in Studio users only."
          type: "boolean"
        status:
          $ref: "#/components/schemas/AppStatus"
        visibility:
          $ref: "#/components/schemas/AppVisibility"
        portalDiscoverable:
          type: "boolean"
        instances:
          type: "array"
          items:
            $ref: "#/components/schemas/AppInstance"
        foreignInstances:
          type: "array"
          items:
            $ref: "#/components/schemas/ForeignAppInstance"
        createdBy:
          type: "string"
        createdDate:
          type: "string"
          format: "date-time"
        lastModifiedBy:
          type: "string"
        lastModifiedDate:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          format: "int32"
    AppInstance:
      description: "An installation of an app in a workspace and environment. It never carries the secret key, only\
        \ a hint (the key's last characters)."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        uuid:
          type: "string"
        appId:
          type: "integer"
          format: "int64"
        appName:
          type: "string"
        appHasIcon:
          description: "Whether the instance's app has an icon."
          type: "boolean"
        appStatus:
          $ref: "#/components/schemas/AppStatus"
        workspaceId:
          type: "integer"
          format: "int64"
        environment:
          $ref: "#/components/schemas/Environment"
        name:
          type: "string"
        ownerUserId:
          type: "integer"
          format: "int64"
        status:
          $ref: "#/components/schemas/AppInstanceStatus"
        visibility:
          $ref: "#/components/schemas/AppVisibility"
        hostingTarget:
          $ref: "#/components/schemas/AppHostingTarget"
        url:
          type: "string"
        secretKeyHint:
          type: "string"
        secretKeyLastUsedDate:
          type: "string"
          format: "date-time"
        userAuthMode:
          $ref: "#/components/schemas/AppUserAuthMode"
        configuration:
          description: "The instance's configuration, a JSON object of at most 64 KB. It is visible to everyone who can\
            \ view the instance and must not hold secrets; credentials belong in connections."
          type: "object"
          additionalProperties: true
        currentAppDeploymentId:
          type: "integer"
          format: "int64"
        deploymentConnectionId:
          description: "The connection the deployment provider of the hosting target uses, if one is set."
          type: "integer"
          format: "int64"
        deploymentSettings:
          description: "The settings the deployment provider of the hosting target uses. They are visible to everyone\
            \ who can view the instance and hold no secrets."
          type: "object"
          additionalProperties: true
        createdBy:
          type: "string"
        createdDate:
          type: "string"
          format: "date-time"
        lastModifiedBy:
          type: "string"
        lastModifiedDate:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          format: "int32"
    ForeignAppInstance:
      description: "An instance of the app that lives in another workspace: no bindings, no key hint, no\
        \ configuration."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        workspaceId:
          type: "integer"
          format: "int64"
        environment:
          $ref: "#/components/schemas/Environment"
        status:
          $ref: "#/components/schemas/AppInstanceStatus"
        currentAppDeploymentId:
          type: "integer"
          format: "int64"
    AppDeploymentProvider:
      description: "Who deployed the app instance. EXTERNAL is a deployment recorded by someone other than ByteChef; DEPLOY_HOOK is a deployment ByteChef started through the deploy hook of a self-hosted instance."
      type: "string"
      enum:
        - "VERCEL"
        - "EXTERNAL"
        - "DEPLOY_HOOK"
    AppDeploymentStatus:
      description: "The status of a deployment. READY, FAILED and CANCELED are final."
      type: "string"
      enum:
        - "QUEUED"
        - "BUILDING"
        - "READY"
        - "FAILED"
        - "CANCELED"
    AppVersion:
      description: "A version of an app: a name for code that ByteChef does not hold."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        appId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        gitRef:
          type: "string"
        gitCommitSha:
          type: "string"
        description:
          type: "string"
        createdBy:
          type: "string"
        createdDate:
          type: "string"
          format: "date-time"
    AppVersionInput:
      description: "The values to create an app version with."
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          maxLength: 256
        gitRef:
          type: "string"
          maxLength: 256
        gitCommitSha:
          type: "string"
          maxLength: 64
        description:
          type: "string"
          maxLength: 4096
    AppDeployment:
      description: "A deployment of a version of the app to an app instance. A deployment is never changed once it is\
        \ final."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        appInstanceId:
          type: "integer"
          format: "int64"
        appVersion:
          $ref: "#/components/schemas/AppVersion"
        provider:
          $ref: "#/components/schemas/AppDeploymentProvider"
        providerDeploymentId:
          type: "string"
        url:
          type: "string"
        status:
          $ref: "#/components/schemas/AppDeploymentStatus"
        errorMessage:
          type: "string"
        current:
          description: "Whether this is the instance's current deployment."
          type: "boolean"
        createdBy:
          type: "string"
        createdDate:
          type: "string"
          format: "date-time"
        finishedDate:
          type: "string"
          format: "date-time"
    AppDeploymentRecordInput:
      description: "The values to record a deployment with."
      type: "object"
      required:
        - "versionName"
      properties:
        versionName:
          description: "The name of the deployed version. A new name creates the version."
          type: "string"
          maxLength: 256
        url:
          description: "Where the deployed version is served, an absolute http or https URL."
          type: "string"
          maxLength: 2048
        gitCommitSha:
          description: "The commit of the deployed version. It must match the commit of an existing version of that\
            \ name."
          type: "string"
          maxLength: 64
    AppDeploymentTriggerInput:
      description: "The version to deploy."
      type: "object"
      required:
        - "appVersionId"
      properties:
        appVersionId:
          description: "The id of a version of the instance's app."
          type: "integer"
          format: "int64"
    AppInstanceDeploymentSettingsUpdate:
      description: "The deployment connection and settings of an app instance. Both absent clears them."
      type: "object"
      properties:
        connectionId:
          description: "The connection the deployment provider calls the hosting service with."
          type: "integer"
          format: "int64"
        settings:
          description: "The provider's settings. They are visible to everyone who can view the instance and must not\
            \ hold secrets."
          type: "object"
          additionalProperties:
            type: "string"
    AppInstanceSecretKey:
      description: "An app instance together with its plaintext secret key, returned once at create and rotate and\
        \ never again."
      type: "object"
      properties:
        appInstance:
          $ref: "#/components/schemas/AppInstance"
        secretKey:
          type: "string"
    AppInput:
      description: "The values to create an app and its first instance with. An absent userAuthMode means REQUIRED\
        \ when the authorization server is on and NONE when it is off; with it off only NONE is accepted."
      type: "object"
      required:
        - "name"
        - "hostingTarget"
      properties:
        name:
          type: "string"
          maxLength: 256
        description:
          type: "string"
        hostingTarget:
          $ref: "#/components/schemas/AppHostingTarget"
        userAuthMode:
          $ref: "#/components/schemas/AppUserAuthMode"
        visibility:
          $ref: "#/components/schemas/AppVisibility"
        category:
          $ref: "#/components/schemas/AppCategory"
        portalDiscoverable:
          description: "Whether the app is listed in the App Portal while it is ACTIVE. Absent means false."
          type: "boolean"
    AppUpdate:
      description: "The values to change on an app. Every field is optional; an absent field keeps its stored\
        \ value."
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 256
        description:
          description: "The new description. An empty string clears it."
          type: "string"
        category:
          $ref: "#/components/schemas/AppCategory"
        portalDiscoverable:
          description: "Whether the app is listed in the App Portal while it is ACTIVE. It may be set in any status."
          type: "boolean"
    AppCategory:
      description: "The category of an app. With an id it is that existing category, the name is ignored, and an\
        \ unknown id answers 400 APP_CATEGORY_INVALID. Without an id the name picks the category of that name,\
        \ created when there is none; an empty name means no category, which on update clears it."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
          maxLength: 256
    AppStatusUpdate:
      description: "The new status of an app."
      type: "object"
      required:
        - "status"
      properties:
        status:
          $ref: "#/components/schemas/AppStatus"
    AppInstanceInput:
      description: "The values to create an app instance with. An absent userAuthMode means REQUIRED when the\
        \ authorization server is on and NONE when it is off; with it off only NONE is accepted."
      type: "object"
      required:
        - "workspaceId"
        - "name"
        - "hostingTarget"
      properties:
        workspaceId:
          description: "The workspace the instance lives in; it may differ from the app's workspace."
          type: "integer"
          format: "int64"
        name:
          type: "string"
          maxLength: 256
        hostingTarget:
          $ref: "#/components/schemas/AppHostingTarget"
        userAuthMode:
          $ref: "#/components/schemas/AppUserAuthMode"
        visibility:
          $ref: "#/components/schemas/AppVisibility"
    AppInstanceUpdate:
      description: "The values to change on an app instance. Every field is optional; an absent field keeps its\
        \ stored value."
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 256
        hostingTarget:
          $ref: "#/components/schemas/AppHostingTarget"
        url:
          description: "The new url: an absolute http or https URL without user info, and https outside DEVELOPMENT while sign-in is on. Any other value answers 400 APP_INSTANCE_URL_INVALID. An empty string clears it."
          type: "string"
          maxLength: 2048
        configuration:
          description: "A JSON object of at most 64 KB that replaces the stored configuration. An empty object clears\
            \ it; absent or null keeps it. It is applied with the other fields in one transaction.\
            \ It is visible to everyone who can view the instance and must not hold secrets."
          type: "object"
          additionalProperties: true
          nullable: true
    AppInstanceStatusUpdate:
      description: "The new status of an app instance."
      type: "object"
      required:
        - "status"
      properties:
        status:
          $ref: "#/components/schemas/AppInstanceStatus"
    AppInstanceUserAuthUpdate:
      description: "The new sign-in mode of an app instance."
      type: "object"
      required:
        - "userAuthMode"
      properties:
        userAuthMode:
          $ref: "#/components/schemas/AppUserAuthMode"
    AppBinding:
      description: "A connection bound to an app instance under a binding key."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        appInstanceId:
          type: "integer"
          format: "int64"
        bindingKey:
          type: "string"
        connectionId:
          type: "integer"
          format: "int64"
        connectionName:
          type: "string"
        componentName:
          type: "string"
        connectionVersion:
          type: "integer"
          format: "int32"
        actionNames:
          type: "array"
          items:
            type: "string"
        toolNames:
          type: "array"
          items:
            type: "string"
        proxyEnabled:
          type: "boolean"
        proxyAllowedMethods:
          type: "array"
          items:
            type: "string"
    AppBindingInput:
      description: "The connection to bind and what the app instance may do with it."
      type: "object"
      required:
        - "connectionId"
      properties:
        connectionId:
          type: "integer"
          format: "int64"
        actionNames:
          description: "The names of the actions the app may run. Defaults to none."
          type: "array"
          items:
            type: "string"
        toolNames:
          description: "The names of the agent tools the app may run. Defaults to none."
          type: "array"
          items:
            type: "string"
        proxyEnabled:
          description: "Whether the app may proxy HTTP requests through the connection. Defaults to false."
          type: "boolean"
        proxyAllowedMethods:
          description: "The HTTP methods the proxy accepts. Defaults to none."
          type: "array"
          items:
            type: "string"
    AppApiCollectionBinding:
      description: "An API collection bound to an app instance."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        appInstanceId:
          type: "integer"
          format: "int64"
        apiCollectionId:
          type: "integer"
          format: "int64"
        name:
          description: "The collection's name, or #apiCollectionId when the collection no longer exists."
          type: "string"
        contextPath:
          type: "string"
        collectionVersion:
          type: "integer"
          format: "int32"
        projectId:
          type: "integer"
          format: "int64"
        projectName:
          type: "string"
        available:
          description: "Whether the collection's deployment exists, is enabled and is in the instance's workspace\
            \ and environment."
          type: "boolean"
    AppBindableApiCollection:
      description: "An API collection that can be bound to an app instance."
      type: "object"
      properties:
        apiCollectionId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        contextPath:
          type: "string"
        collectionVersion:
          type: "integer"
          format: "int32"
        projectId:
          type: "integer"
          format: "int64"
        projectName:
          type: "string"
        available:
          description: "Whether the collection's deployment is enabled."
          type: "boolean"
    AppWorkflowBinding:
      description: "A workflow bound to an app instance under a workflow key."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        appInstanceId:
          type: "integer"
          format: "int64"
        workflowKey:
          type: "string"
        projectDeploymentId:
          type: "integer"
          format: "int64"
        projectDeploymentName:
          type: "string"
        workflowUuid:
          type: "string"
        workflowName:
          type: "string"
        available:
          type: "boolean"
    AppWorkflowBindingInput:
      description: "The deployed workflow to bind."
      type: "object"
      required:
        - "projectDeploymentId"
        - "workflowUuid"
      properties:
        projectDeploymentId:
          type: "integer"
          format: "int64"
        workflowUuid:
          type: "string"
    AppBindableConnection:
      description: "A connection that can be bound to an app instance."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        componentName:
          type: "string"
        connectionVersion:
          type: "integer"
          format: "int32"
        componentVersion:
          type: "integer"
          format: "int32"
        usable:
          description: "Whether the connection's credentials are valid and the caller may use it."
          type: "boolean"
    AppBindableWorkflow:
      description: "A deployed app-callable workflow that can be bound to an app instance."
      type: "object"
      properties:
        projectDeploymentId:
          type: "integer"
          format: "int64"
        projectDeploymentName:
          type: "string"
        projectName:
          type: "string"
        workflowUuid:
          type: "string"
        workflowName:
          type: "string"
        description:
          type: "string"
    AppComponentOperations:
      description: "The names of the actions and agent tools of a component version."
      type: "object"
      properties:
        actionNames:
          type: "array"
          items:
            type: "string"
        toolNames:
          type: "array"
          items:
            type: "string"
    AppWorkspaceConnection:
      description: "A connection of a workspace. It never carries parameters or credentials."
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        componentName:
          type: "string"
        connectionVersion:
          type: "integer"
          format: "int32"
        authorizationType:
          type: "string"
        credentialStatus:
          type: "string"
        aiProvider:
          description: "Whether this is a virtual AI-provider connection, which never fills a deployment connection slot."
          type: "boolean"
        usable:
          description: "Whether the connection's credentials are valid and the caller may use it."
          type: "boolean"
