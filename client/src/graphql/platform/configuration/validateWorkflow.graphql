query ValidateWorkflow($workflowDefinition: String!, $workflowId: String, $environmentId: Long) {
    validateWorkflow(workflow: $workflowDefinition, workflowId: $workflowId, environmentId: $environmentId) {
        errors
        warnings
        nodeIssues {
            nodeName
            propertyPath
            kind
            severity
            message
        }
    }
}
