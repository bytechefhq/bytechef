mutation updateIdentityProvider($id: ID!, $input: IdentityProviderInput!) {
    updateIdentityProvider(id: $id, input: $input) {
        authoritiesClaim
        authorityMappings {
            authority
            externalGroup
        }
        autoProvision
        clientId
        createdBy
        createdDate
        defaultAuthority
        domains
        enabled
        enforced
        id
        issuerUri
        lastModifiedBy
        lastModifiedDate
        mcpEmbedded
        mcpAutomation
        mcpManagement
        metadataUri
        mfaMethod
        mfaRequired
        name
        nameIdFormat
        scopes
        signingCertificate
        type
        validateMcpAudience
    }
}
