query AuditEvents(
    $eventType: String
    $fromDate: Long
    $toDate: Long
    $search: String
    $platform: PlatformType
    $page: Int
    $size: Int
) {
    auditEvents(
        eventType: $eventType
        fromDate: $fromDate
        toDate: $toDate
        search: $search
        platform: $platform
        page: $page
        size: $size
    ) {
        content {
            data {
                key
                value
            }
            eventDate
            eventType
            id
            outcome
            platform
            principal
        }
        number
        size
        totalElements
        totalPages
    }
}

query AuditEventTypes {
    auditEventTypes
}
