query dataTables($environmentId: ID!, $workspaceId: ID!) {
    dataTables(environmentId: $environmentId, workspaceId: $workspaceId) {
        id
        baseName
        lastModifiedDate
        columns {
            id
            name
            type
            link {
                targetDataTableId
                targetDataTableName
                onDelete
                displayColumnName
            }
        }
    }
}
