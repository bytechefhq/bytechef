query dataTableRowsPage($environmentId: ID!, $tableId: ID!, $limit: Int, $offset: Int, $expand: [String!]) {
    dataTableRowsPage(
        environmentId: $environmentId
        tableId: $tableId
        limit: $limit
        offset: $offset
        expand: $expand
    ) {
        items {
            id
            values
        }
        hasMore
        nextOffset
    }
}
