mutation updateAppInstance($id: ID!, $input: AppInstanceUpdateInput!) {
    updateAppInstance(id: $id, input: $input) {
        id
        uuid
        app {
            id
            name
            description
            status
        }
        workspaceId
        environmentId
        name
        ownerUserId
        status
        visibility
        hostingTarget
        url
        secretKeyHint
        secretKeyLastUsedDate
        userAuthMode
        currentAppDeploymentId
        createdBy
        createdDate
        lastModifiedBy
        lastModifiedDate
        version
    }
}
