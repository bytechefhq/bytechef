mutation rotateAppSecretKey($id: ID!) {
    rotateAppSecretKey(id: $id) {
        secretKey
        app {
            id
            uuid
            name
            description
            workspaceId
            environmentId
            ownerUserId
            status
            visibility
            hostingTarget
            url
            lastDeployedDate
            secretKeyHint
            secretKeyLastUsedDate
            createdBy
            createdDate
            lastModifiedBy
            lastModifiedDate
        }
    }
}
