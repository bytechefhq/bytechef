query appInstance($id: ID!) {
    appInstance(id: $id) {
        id
        uuid
        app {
            id
            name
            description
            status
        }
        workspaceId
        environmentId
        name
        ownerUserId
        status
        visibility
        hostingTarget
        url
        secretKeyHint
        secretKeyLastUsedDate
        userAuthMode
        currentAppDeploymentId
        deploymentConnectionId
        deploymentProviderAvailable
        createdBy
        createdDate
        lastModifiedBy
        lastModifiedDate
        version
    }
}
