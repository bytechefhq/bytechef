mutation updateAppStatus($id: ID!, $status: AppStatus!) {
    updateAppStatus(id: $id, status: $status) {
        id
        uuid
        name
        description
        workspaceId
        ownerUserId
        status
        visibility
        instances {
            id
            uuid
            app {
                id
                name
                description
                status
            }
            workspaceId
            environmentId
            name
            ownerUserId
            status
            visibility
            hostingTarget
            url
            secretKeyHint
            secretKeyLastUsedDate
            userAuthMode
            currentAppDeploymentId
            createdBy
            createdDate
            lastModifiedBy
            lastModifiedDate
            version
        }
        foreignInstances {
            id
            name
            workspaceId
            environmentId
            status
            currentAppDeploymentId
        }
        createdBy
        createdDate
        lastModifiedBy
        lastModifiedDate
        version
    }
}
