query ToolInvocationLogs(
    $type: PlatformType!
    $environmentId: ID
    $surface: String
    $outcome: String
    $mcpServerId: Long
    $connectedUserId: Long
    $integrationInstanceId: Long
    $appId: Long
    $fromDate: Long
    $toDate: Long
    $page: Int
) {
    toolInvocationLogs(
        type: $type
        environmentId: $environmentId
        surface: $surface
        outcome: $outcome
        mcpServerId: $mcpServerId
        connectedUserId: $connectedUserId
        integrationInstanceId: $integrationInstanceId
        appId: $appId
        fromDate: $fromDate
        toDate: $toDate
        page: $page
    ) {
        content {
            id
            surface
            kind
            toolName
            componentName
            componentVersion
            operationName
            connectionId
            environment
            externalUserId
            connectedUserId
            integrationInstanceId
            mcpServerId
            jobId
            appId
            workflowName
            outcome
            errorType
            errorMessage
            durationMs
            createdDate
        }
        number
        size
        totalElements
        totalPages
    }
}
