mutation createCodeWorkflow(
    $workspaceId: ID!
    $name: String!
    $language: CodeWorkflowLanguage!
    $description: String
    $categoryId: ID
    $tags: [String!]
) {
    createCodeWorkflow(
        workspaceId: $workspaceId
        name: $name
        language: $language
        description: $description
        categoryId: $categoryId
        tags: $tags
    )
}
