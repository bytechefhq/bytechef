query automationProjectConfigurationWorkflowInputOptions(
    $id: ID!
    $workflowUuid: ID!
    $projectVersion: Int
    $inputName: String!
    $propertyName: String!
    $connectionId: ID!
    $lookupDependsOnValues: Map
    $searchText: String
) {
    automationProjectConfigurationWorkflowInputOptions(
        id: $id
        workflowUuid: $workflowUuid
        projectVersion: $projectVersion
        inputName: $inputName
        propertyName: $propertyName
        connectionId: $connectionId
        lookupDependsOnValues: $lookupDependsOnValues
        searchText: $searchText
    ) {
        label
        value
        description
    }
}
