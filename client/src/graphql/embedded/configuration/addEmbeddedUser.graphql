mutation AddEmbeddedUser($userId: ID!, $role: WorkspaceRole, $customRoleId: ID) {
    addEmbeddedUser(userId: $userId, role: $role, customRoleId: $customRoleId) {
        id
        userId
        embeddedRole
        customRoleId
        user {
            email
            firstName
            lastName
        }
    }
}
