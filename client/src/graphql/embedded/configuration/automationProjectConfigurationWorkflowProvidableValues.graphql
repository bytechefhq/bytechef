query automationProjectConfigurationWorkflowProvidableValues($id: ID!, $workflowUuid: ID!) {
    automationProjectConfigurationWorkflowProvidableValues(id: $id, workflowUuid: $workflowUuid) {
        connectionSlots {
            componentName
            title
            required
            providableConnections {
                id
                name
            }
        }
        inputs {
            name
            label
            type
            required
            componentName
            componentVersion
            groupName
            optionConnections {
                id
                name
            }
        }
        providedConnections
        providedInputs
    }
}
