mutation SetEmbeddedUserEnvironmentRole(
    $userId: ID!
    $environment: EnvironmentEnum!
    $role: WorkspaceRole
    $customRoleId: ID
) {
    setEmbeddedUserEnvironmentRole(
        userId: $userId
        environment: $environment
        role: $role
        customRoleId: $customRoleId
    ) {
        id
        userId
        embeddedRole
        customRoleId
        environment
    }
}
