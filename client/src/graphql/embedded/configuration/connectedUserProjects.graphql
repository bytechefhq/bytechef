query connectedUserProjects($connectedUserId: ID, $environmentId: ID) {
    connectedUserProjects(connectedUserId: $connectedUserId, environmentId: $environmentId) {
        id
        connectedUser {
            id
            environmentId
            externalId
        }
        connectedUserProjectWorkflows {
            id
            automationWorkflowUuid
            connectedUserId
            copiedFromWorkflowUuid
            enabled
            lastExecutionDate
            projectId
            staticWebhookUrl
            workflowUuid
            workflowVersion
            workflow {
                id
                label
                triggers {
                    name
                    type
                    parameters
                }
            }
        }
        automationProjectConfigurations {
            projectId
            configurationId
            configurationName
            configurationProjectVersion
        }
        environmentId
        lastExecutionDate
        projectId
        projectVersion
    }
}
