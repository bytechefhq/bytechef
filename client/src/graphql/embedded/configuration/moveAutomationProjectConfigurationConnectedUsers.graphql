mutation moveAutomationProjectConfigurationConnectedUsers(
    $sourceId: ID!
    $targetId: ID!
    $connectedUserIds: [ID!]!
    $workflowInputs: [ConfigurationMoveWorkflowInputs!]
) {
    moveAutomationProjectConfigurationConnectedUsers(
        sourceId: $sourceId
        targetId: $targetId
        connectedUserIds: $connectedUserIds
        workflowInputs: $workflowInputs
    ) {
        movedConnectedUserIds
        needsAttentionConnectedUserIds
        skipped {
            connectedUserId
            reason
            workflowLabels
        }
    }
}
