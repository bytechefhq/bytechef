query automationProjectConfigurations($projectId: ID!, $environmentId: ID) {
    automationProjectConfigurations(projectId: $projectId, environmentId: $environmentId) {
        id
        projectId
        environmentId
        name
        permissionExpression
        connectedUserCount
        projectVersion
        enabled
        automationHubVisible
        lastModifiedDate
        lastExecutionDate
        workflows {
            workflowUuid
            workflowId
            label
            enabled
            lastExecutionDate
            providedConnections
            providedInputs
        }
    }
}
