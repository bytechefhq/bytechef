query automationProjectConfigurationUpgradeImpact($targetId: ID!, $connectedUserIds: [ID!]!) {
    automationProjectConfigurationUpgradeImpact(targetId: $targetId, connectedUserIds: $connectedUserIds) {
        workflows {
            workflowUuid
            label
            newRequiredInputs
            newRequiredConnections
            affectedConnectedUserCount
        }
        skipped {
            connectedUserId
            reason
            workflowLabels
        }
    }
}
