mutation AddEmbeddedUserByEmail($email: String!, $role: WorkspaceRole, $customRoleId: ID) {
    addEmbeddedUserByEmail(email: $email, role: $role, customRoleId: $customRoleId) {
        id
        userId
        embeddedRole
        customRoleId
        user {
            email
            firstName
            lastName
        }
    }
}
