query automationWorkflowProjectConfigurations($projectId: ID!) {
    automationWorkflowProjectConfigurations(projectId: $projectId) {
        id
        projectId
        environmentId
        name
        permissionExpression
        connectedUserCount
        projectVersion
        enabled
        automationHubVisible
        lastModifiedDate
        lastExecutionDate
        workflows {
            workflowUuid
            workflowId
            label
            enabled
            lastExecutionDate
            providedConnections
            providedInputs
        }
    }
}
