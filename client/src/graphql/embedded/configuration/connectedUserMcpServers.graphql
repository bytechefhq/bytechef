query connectedUserMcpServers($connectedUserId: ID!) {
    connectedUserMcpServers(connectedUserId: $connectedUserId) {
        id
        name
        enabled
        environmentId
        lastModifiedDate
        tools {
            id
            componentName
            componentVersion
            integrationInstanceId
            name
            enabled
        }
        workflows {
            integrationInstanceId
            componentName
            integrationVersion
            workflowId
            name
            description
            enabled
            lastExecutionDate
        }
    }
}
