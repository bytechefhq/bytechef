mutation updateEmbeddedMcpComponent($id: ID!, $input: McpComponentWithToolsInput!, $integrationId: ID) {
    updateEmbeddedMcpComponent(id: $id, input: $input, integrationId: $integrationId) {
        id
        componentName
        componentVersion
        title
        mcpServerId
        connectionId
        createdBy
        createdDate
        integrationId
        lastModifiedBy
        lastModifiedDate
        version
    }
}
