mutation updateAutomationProjectConfiguration($id: ID!, $name: String!, $permissionExpression: String, $projectVersion: Int!, $enabled: Boolean!, $automationHubVisible: Boolean!) {
    updateAutomationProjectConfiguration(id: $id, name: $name, permissionExpression: $permissionExpression, projectVersion: $projectVersion, enabled: $enabled, automationHubVisible: $automationHubVisible)
}
