query automationProjectVersionWorkflowChange($id: ID!, $projectVersion: Int!, $workflowUuid: String!) {
    automationProjectVersionWorkflowChange(id: $id, projectVersion: $projectVersion, workflowUuid: $workflowUuid) {
        workflowUuid
        label
        changeType
        baseVersion
        version
        oldDefinition
        newDefinition
        changes {
            kind
            target
            name
            type
            label
            parentPath
            valueChanges {
                path
                oldValue
                newValue
            }
        }
    }
}
