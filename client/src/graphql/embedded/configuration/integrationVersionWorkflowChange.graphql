query integrationVersionWorkflowChange($integrationId: ID!, $integrationVersion: Int!, $workflowUuid: String!) {
    integrationVersionWorkflowChange(integrationId: $integrationId, integrationVersion: $integrationVersion, workflowUuid: $workflowUuid) {
        workflowUuid
        label
        changeType
        baseVersion
        version
        oldDefinition
        newDefinition
        changes {
            kind
            target
            name
            type
            label
            parentPath
            valueChanges {
                path
                oldValue
                newValue
            }
        }
    }
}
