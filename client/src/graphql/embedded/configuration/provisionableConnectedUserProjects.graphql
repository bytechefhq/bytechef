query provisionableConnectedUserProjects($connectedUserId: ID!) {
    provisionableConnectedUserProjects(connectedUserId: $connectedUserId) {
        projectId
        name
        projectVersion
        assignedConfigurationId
        workflows {
            workflowUuid
            label
            inputs {
                name
                label
                type
                required
            }
            provisioned
            dangling
        }
        configurations {
            id
            name
            projectVersion
            selfServe
            workflows {
                workflowUuid
                label
                inputs {
                    name
                    label
                    type
                    required
                }
                provisioned
                dangling
            }
        }
    }
}
