mutation createEmbeddedMcpComponent($input: McpComponentWithToolsInput!, $integrationId: ID!) {
    createEmbeddedMcpComponent(input: $input, integrationId: $integrationId) {
        id
        componentName
        componentVersion
        title
        mcpServerId
        connectionId
        createdBy
        createdDate
        integrationId
        lastModifiedBy
        lastModifiedDate
        version
    }
}
