mutation createAutomationWorkflowProjectConfiguration($projectId: ID!, $environmentId: ID!, $name: String!, $permissionExpression: String, $projectVersion: Int!, $enabled: Boolean!, $automationHubVisible: Boolean!) {
    createAutomationWorkflowProjectConfiguration(projectId: $projectId, environmentId: $environmentId, name: $name, permissionExpression: $permissionExpression, projectVersion: $projectVersion, enabled: $enabled, automationHubVisible: $automationHubVisible)
}
