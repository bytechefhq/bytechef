query embeddedAiAutoMemories($environment: Int!, $connectedUserId: ID, $memoryType: AiAutoMemoryType) {
    embeddedAiAutoMemories(environment: $environment, connectedUserId: $connectedUserId, memoryType: $memoryType) {
        id
        name
        title
        description
        memoryType
        content
        environmentId
        version
        createdAt
        updatedAt
        principalType
        principalId
        connectedUser {
            id
            name
            email
            externalId
        }
        integration {
            id
            name
            componentName
        }
        automation {
            id
            name
        }
    }
}
