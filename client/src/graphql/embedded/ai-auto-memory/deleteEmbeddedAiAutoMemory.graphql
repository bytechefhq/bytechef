mutation deleteEmbeddedAiAutoMemory(
    $id: ID!
    $principalType: AiAutoMemoryPrincipalType!
    $principalId: ID!
    $environment: Int!
) {
    deleteEmbeddedAiAutoMemory(
        id: $id
        principalType: $principalType
        principalId: $principalId
        environment: $environment
    )
}
