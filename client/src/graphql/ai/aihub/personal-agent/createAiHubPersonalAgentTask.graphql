mutation createAiHubPersonalAgentTask($input: CreateAiHubPersonalAgentTaskInput!) {
    createAiHubPersonalAgentTask(input: $input) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        kind
        workflowExecutionId
        projectDeploymentId
        aiHubPersonalAgentId
        autoTitled
    }
}
