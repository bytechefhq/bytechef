query aiHubChatArtifactsByAiHubChat($workspaceId: ID!, $id: ID!) {
    aiHubChatArtifactsByAiHubChat(workspaceId: $workspaceId, id: $id) {
        id
        chatId
        kind
        status
        artifactId
        artifactName
        metadataJson
        environmentId
        createdAt
        statusChangedAt
    }
}
