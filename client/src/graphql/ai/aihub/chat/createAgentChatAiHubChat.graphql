mutation createAgentChatAiHubChat(
    $workspaceId: ID!
    $environment: Int!
    $workflowExecutionId: String!
    $projectDeploymentId: ID!
    $title: String
) {
    createAgentChatAiHubChat(
        workspaceId: $workspaceId
        environment: $environment
        workflowExecutionId: $workflowExecutionId
        projectDeploymentId: $projectDeploymentId
        title: $title
    ) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        kind
        workflowExecutionId
        projectDeploymentId
        autoTitled
        aiAgentId
    }
}
