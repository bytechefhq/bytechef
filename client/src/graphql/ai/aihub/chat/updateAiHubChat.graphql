mutation updateAiHubChat($input: AiHubChatPatchInput!) {
    updateAiHubChat(input: $input) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        autoTitled
        ownerUserId
        isOwner
    }
}
