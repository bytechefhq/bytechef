mutation updateAiHubChat($input: AiHubChatPatchInput!) {
    updateAiHubChat(input: $input) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        kind
        workflowExecutionId
        projectDeploymentId
        autoTitled
        aiAgentId
    }
}
