query aiHubChatArtifacts(
    $workspaceId: ID!
    $environment: Int
    $userId: ID
    $kind: AiHubChatArtifactKind
    $from: Long
    $to: Long
    $page: Int
    $size: Int
) {
    aiHubChatArtifacts(
        workspaceId: $workspaceId
        environment: $environment
        userId: $userId
        kind: $kind
        from: $from
        to: $to
        page: $page
        size: $size
    ) {
        items {
            id
            chatId
            kind
            status
            artifactId
            artifactName
            metadataJson
            environmentId
            createdAt
            statusChangedAt
        }
        totalCount
        hasMore
        pageClamped
        sizeClamped
    }
}
