mutation setAiHubUserConnectorToolRequiresApproval(
    $workspaceId: ID!
    $connectorId: ID!
    $toolName: String!
    $requiresApproval: Boolean!
) {
    setAiHubUserConnectorToolRequiresApproval(
        workspaceId: $workspaceId
        connectorId: $connectorId
        toolName: $toolName
        requiresApproval: $requiresApproval
    )
}
