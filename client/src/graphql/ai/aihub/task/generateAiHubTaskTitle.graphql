mutation generateAiHubTaskTitle($workspaceId: ID!, $id: ID!) {
    generateAiHubTaskTitle(workspaceId: $workspaceId, id: $id) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        kind
        workflowExecutionId
        projectDeploymentId
        aiHubPersonalAgentId
        autoTitled
    }
}
