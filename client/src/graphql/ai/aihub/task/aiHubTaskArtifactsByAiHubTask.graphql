query aiHubTaskArtifactsByAiHubTask($workspaceId: ID!, $id: ID!) {
    aiHubTaskArtifactsByAiHubTask(workspaceId: $workspaceId, id: $id) {
        id
        taskId
        kind
        status
        artifactId
        artifactName
        metadataJson
        environmentId
        createdAt
        statusChangedAt
    }
}
