query aiHubTasks($workspaceId: ID!, $environment: Int!, $status: AiHubTaskStatus) {
    aiHubTasks(workspaceId: $workspaceId, environment: $environment, status: $status) {
        id
        workspaceId
        userId
        threadId
        title
        lastPreview
        messageCount
        status
        environmentId
        createdAt
        updatedAt
        kind
        workflowExecutionId
        projectDeploymentId
        aiHubPersonalAgentId
        autoTitled
    }
}
