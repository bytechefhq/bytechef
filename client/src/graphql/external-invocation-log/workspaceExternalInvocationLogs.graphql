query WorkspaceExternalInvocationLogs(
    $type: PlatformType!
    $workspaceId: ID!
    $environmentId: ID!
    $source: String
    $status: String
    $mcpServerId: Long
    $a2aServerId: Long
    $connectedUserId: Long
    $integrationInstanceId: Long
    $appId: Long
    $fromDate: Long
    $toDate: Long
    $page: Int
) {
    workspaceExternalInvocationLogs(
        type: $type
        workspaceId: $workspaceId
        environmentId: $environmentId
        source: $source
        status: $status
        mcpServerId: $mcpServerId
        a2aServerId: $a2aServerId
        connectedUserId: $connectedUserId
        integrationInstanceId: $integrationInstanceId
        appId: $appId
        fromDate: $fromDate
        toDate: $toDate
        page: $page
    ) {
        content {
            id
            source
            kind
            invocationName
            componentName
            componentVersion
            operationName
            connectionId
            environment
            externalUserId
            connectedUserId
            integrationInstanceId
            mcpServerId
            a2aServerId
            jobId
            appId
            workflowName
            status
            errorType
            errorMessage
            durationMs
            createdDate
        }
        number
        size
        totalElements
        totalPages
    }
}
