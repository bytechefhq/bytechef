<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.workspace.membership.title}">ByteChef workspace</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p th:text="#{email.activation.greeting(${user.login})}">Dear</p>
    <p th:text="#{email.workspace.membership.text1}">You've been added to the workspace below.</p>
    <p>
      <strong th:text="${workspaceName}">Workspace</strong>
    </p>
    <p>
      <a th:with="url=(@{|${baseUrl}/automation|})" th:href="${url}" th:text="${url}">ByteChef</a>
    </p>
    <p>
      <span th:text="#{email.activation.text2}">Regards, </span>
      <br />
      <em th:text="#{email.signature}">ByteChef.</em>
    </p>
  </body>
</html>
