---
label: "Resumable child"
outputs:
- name: "result"
  value: "${afterResume}"
tasks:
- name: "beforeSuspend"
  type: "var/v1/set"
  parameters:
    value: "reached the suspending step"
- name: "requestApproval"
  type: "suspend/v1"
- name: "afterResume"
  type: "var/v1/set"
  parameters:
    value: "${requestApproval.decision}"
