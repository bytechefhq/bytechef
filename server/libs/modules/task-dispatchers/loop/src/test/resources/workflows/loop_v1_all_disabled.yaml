---
label: "Loop With Every Task Disabled"
tasks:
- name: "loop_1"
  type: "loop/v1"
  disabled: true
  parameters:
    items: "=range(1,3)"
    iteratee:
    - name: "innerVar"
      type: "var/v1/set"
      parameters:
        value: "=loop_1.item"
- name: "afterLoop"
  type: "var/v1/set"
  disabled: true
  parameters:
    value: "done"
