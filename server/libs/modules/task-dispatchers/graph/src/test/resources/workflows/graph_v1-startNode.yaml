---
label: "Graph Start Node"
outputs:
- name: "result"
  value: "${graph_1}"
tasks:
- name: "graph_1"
  type: "graph/v1"
  parameters:
    startNode: "bTask"
    nodes:
    - name: "aTask"
      type: "var/v1/set"
      parameters:
        value: "A output"
    - name: "bTask"
      type: "var/v1/set"
      parameters:
        value: "B output"
    transitions:
    - from: "aTask"
      to: "bTask"
