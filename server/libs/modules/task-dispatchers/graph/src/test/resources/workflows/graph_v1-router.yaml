---
label: "Graph Router Nodes"
outputs:
- name: "result"
  value: "${graph_1}"
tasks:
- name: "graph_1"
  type: "graph/v1"
  parameters:
    nodes:
    - name: "routerStart"
      next: "afterStart"
    - name: "afterStart"
      tasks:
      - name: "afterStartTask"
        type: "var/v1/set"
        parameters:
          value: "reached afterStart"
      next: "routerMid"
    - name: "routerMid"
      next: "finalNode"
    - name: "finalNode"
      tasks:
      - name: "finalTask"
        type: "var/v1/set"
        parameters:
          value: "reached finalNode"
