---
label: "Graph Nested Graph Empty Inner Start"
outputs:
- name: "result"
  value: "${outerGraph_1}"
tasks:
- name: "outerGraph_1"
  type: "graph/v1"
  parameters:
    nodes:
    - name: "outerNode"
      tasks:
      - name: "innerGraph_1"
        type: "graph/v1"
        parameters:
          nodes:
          - name: "innerRouterStart"
            next: "innerReal"
          - name: "innerReal"
            tasks:
            - name: "innerTask"
              type: "var/v1/set"
              parameters:
                value: "inner graph via router output"
