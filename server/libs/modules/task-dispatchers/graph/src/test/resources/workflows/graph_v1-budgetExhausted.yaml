---
label: "Graph Budget Exhausted"
tasks:
- name: "graph_1"
  type: "graph/v1"
  parameters:
    maxTransitions: 3
    nodes:
    - name: "xTask"
      type: "var/v1/set"
      parameters:
        value: "x"
    - name: "yTask"
      type: "var/v1/set"
      parameters:
        value: "y"
    transitions:
    - from: "xTask"
      to: "yTask"
    - from: "yTask"
      to: "xTask"
