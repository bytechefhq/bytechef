---
label: "Map With Disabled Iteratee"
tasks:
- name: "map_1"
  type: "map/v1"
  parameters:
    items: "=range(1,3)"
    iteratee:
    - name: "skippedVar"
      type: "var/v1/set"
      disabled: true
      parameters:
        value: "=map_1.item"
- name: "afterMap"
  type: "var/v1/set"
  parameters:
    value: "done"
