---
label: "If Task Output"
outputs:
- name: "result"
  value: "${condition_1}"
tasks:
- name: "condition_1"
  type: "condition/v1"
  parameters:
    conditions:
    - - type: "boolean"
        value1: "true"
        operation: "EQUALS"
        value2: "true"
    caseTrue:
    - name: "lastTask"
      type: "var/v1/set"
      parameters:
        value: "last task output"
    caseFalse:
    - name: "lastTask"
      type: "var/v1/set"
      parameters:
        value: "false branch output"
