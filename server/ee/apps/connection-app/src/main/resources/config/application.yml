spring:
  application:
    name: connection-app
  cloud:
    config:
      username: ${BYTECHEF_CONFIG_SERVER_USERNAME:configserver}
      password: ${BYTECHEF_CONFIG_SERVER_PASSWORD:dev-config-server-secret}
  config:
    import: optional:configserver:http://localhost:6111
  grpc:
    server:
      # Dormant by default; enabled together with bytechef.remote.transport=grpc for the gRPC remote transport.
      enabled: false
  profiles:
    active: #spring.profiles.active#
