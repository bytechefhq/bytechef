server:
  port: 9999

spring:
  grpc:
    server:
      port: 0

bytechef:
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  remote:
    grpc:
      plaintext: true
      service-token: test-service-token
  webhook-delivery:
    concurrency-limit: 10
    max-pending-deliveries: 1000
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      provider: JDBC
