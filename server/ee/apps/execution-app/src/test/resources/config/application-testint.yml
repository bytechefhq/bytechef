server:
  port: 9999

openapi:
  openAPIDefinition:
    base-path:
      automation: /api/automation
      embedded: /api/embedded
      platform: /api/platform

spring:
  cloud:
    aws:
      s3:
        enabled: false
  liquibase:
    contexts: execution

bytechef:
  data-storage:
    provider: JDBC
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  workflow:
    output-storage:
      provider: JDBC
