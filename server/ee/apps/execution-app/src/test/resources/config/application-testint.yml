server:
  port: 9999

spring:
  cloud:
    aws:
      s3:
        enabled: false
  grpc:
    server:
      port: 0
  liquibase:
    contexts: execution

openapi:
  openAPIDefinition:
    base-path:
      automation: /api/automation
      embedded: /api/embedded
      platform: /api/platform

bytechef:
  data-storage:
    provider: JDBC
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  remote:
    grpc:
      plaintext: true
      service-token: test-service-token
  workflow:
    output-storage:
      provider: JDBC
