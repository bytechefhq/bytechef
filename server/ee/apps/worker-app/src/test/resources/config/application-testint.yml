server:
  port: 9999

bytechef:
  discovery-service:
    provider: redis
  data-storage:
    provider: jdbc
  edition: EE
  file-storage:
    provider: jdbc
  message-broker:
    provider: memory
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      provider: jdbc
