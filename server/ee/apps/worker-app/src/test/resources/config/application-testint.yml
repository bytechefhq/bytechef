server:
  port: 9999

bytechef:
  discovery-service:
    provider: redis
  data-storage:
    provider: jdbc
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: jdbc
  message-broker:
    provider: memory
  workflow:
    output-storage:
      provider: jdbc
