server:
  port: 9999

bytechef:
  discovery-service:
    provider: REDIS
  data-storage:
    provider: JDBC
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      provider: JDBC
