server:
  port: 9999

bytechef:
  discovery-service:
    provider: REDIS
  data-storage:
    provider: JDBC
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  workflow:
    output-storage:
      provider: JDBC
