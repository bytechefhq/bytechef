server:
  port: 9999

spring:
  grpc:
    server:
      port: 0

bytechef:
  discovery-service:
    provider: REDIS
  data-storage:
    provider: JDBC
  edition: EE
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  message-broker:
    provider: MEMORY
  script:
    sandbox:
      enabled: true
      max-concurrent-executions: 16
      max-cpu-time: 5m
      max-heap-memory: 512MB
  remote:
    grpc:
      plaintext: true
      service-token: test-service-token
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      provider: JDBC
