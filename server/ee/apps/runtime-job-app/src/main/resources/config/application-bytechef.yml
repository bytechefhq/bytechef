bytechef:
  ai:
    agent-utils:
      # Hosts the web fetch tool may reach although they resolve to a private or loopback address
      allowed-private-hosts: []
      shell:
        # Allow Shell Tools elements to run commands directly on the server instead of in a Docker container. Local
        # commands are not confined to the agent workspace; allow only on trusted single-tenant installations
        allow-local: false
        docker:
          # Docker-compatible CLI on the server's PATH (docker | podman)
          command: docker
          # How long an agent's container may stay unused before it is removed
          idle-timeout: 10m
          # Container image for shell commands; must provide /bin/bash and sleep
          image: debian:bookworm-slim
        enabled: false
      workspace:
        basedir: ${user.home}/bytechef/data/ai-agent-workspaces
  approval:
    signed-token:
      # Tolerance applied to signed approval link expiry checks default: PT60S
      clock-skew: PT60S
      # Lifetime of a signed approval/resume link default: P30D
      default-ttl: P30D
      # Base64 signing secrets accepted for verification after a rotation
      # previous-secrets:
      # Fail startup when no signing secret can be resolved default: false
      required: false
      # Base64 signing secret (at least 32 bytes); derived from the encryption key when unset
      # secret:
  async:
    # Upper bound on concurrent @Async tasks on the default executor. There is no queue: a submitter waits for a
    # permit. Workflow task and trigger execution are bounded separately by bytechef.worker.task.*.
    concurrency-limit: 200
  cache:
    # Cache provider (CAFFEINE) default: CAFFEINE
    provider: CAFFEINE
  coordinator:
    # Whether this instance runs the coordinator (orchestrates job execution)
    enabled: true
    task:
      # Number of concurrent consumers per coordinator task message route (used by AMQP | JMS brokers)
      subscriptions:
        application-events: 1
        resume-job-events: 1
        start-job-events: 1
        stop-job-events: 1
        task-execution-complete-events: 1
        task-execution-error-events: 1
  data-storage:
    # Data storage provider
    provider: FILESYSTEM
  # Edition (CE - Community Edition | EE - Enterprise Edition) default: EE
  edition: EE
  # Encryption key provider (FILESYSTEM - the key generated on filesystem, PROPERTY - the key read from property) default: FILESYSTEM
  encryption:
    provider: FILESYSTEM
  # Enabled feature flags, e.g. [ff-123, ff-456]
  feature-flags: []
  file-storage:
    # File storage provider (AWS(EE) | FILESYSTEM | JDBC) default: FILESYSTEM
    provider: FILESYSTEM
    filesystem:
      basedir: ${user.home}/bytechef/data/file-storage
  mail:
    base-url: ${bytechef.public-url}
    from: noreply@app.bytechef.io
    host:
    port: 25
  message-broker:
    # Messaging provider between Coordinator and Workers (MEMORY) default: MEMORY
    provider: MEMORY
  observability:
    logging:
      aws:
        # Sign OTLP log export requests with AWS SigV4 (CloudWatch OTLP endpoint https://logs.{region}.amazonaws.com/v1/logs).
        enabled: false
        # AWS service name used in the SigV4 signature scope
        service: logs
      enabled: false
      endpoint: http://localhost:4318/v1/logs
    metrics:
      enabled: false
      endpoint: http://localhost:4318/v1/metrics
    tracing:
      enabled: false
      endpoint: http://localhost:4318/v1/traces
  public-url:
  # Tenant support mode (SINGLE | MULTI - EE only) default: SINGLE
  tenant:
    mode: SINGLE
  # When the worker is enabled, subscribe to the default "default" queue with 10 concurrent consumers.
  # You may also route workflow tasks to other arbitrarily named task queues by specifying the "node"
  # property on any given task.
  # E.g. node: captions will route to the captions queue which a worker would subscribe to with workflow.worker.subscriptions.captions.
  # Note: queue must be created before tasks can be routed to it. ByteChef will create the queue if it isn't already there when the worker
  # bootstraps.
  worker:
    # Whether this instance runs the worker (executes workflow tasks)
    enabled: true
    task:
      subscriptions:
        default: 10
      # Concurrent executions in the synchronous, interactive lane
      sync-concurrency-limit: 5
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      # Output storage provider for workflow output data
      provider: FILESYSTEM
    repository:
      filesystem:
        enabled: true
        location-pattern: ${user.home}/bytechef/data/workflows/*.{json|yml|yaml}
      classpath:
        enabled: true
        location-pattern: workflows/*.{json|yml|yaml}
      git:
        enabled: false
      jdbc:
        enabled: false
