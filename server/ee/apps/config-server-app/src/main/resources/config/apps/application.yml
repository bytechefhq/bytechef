---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---

docs:
  changelog-url: https://github.com/bytechefhq/bytechef/releases
  community-support-url: https://discord.gg/VKvNxHjpYx
  documentation-url: https://docs.bytechef.io
  report-bug-url: https://github.com/bytechefhq/bytechef/issues

info:
  ai:
    copilot:
      enabled: ${bytechef.ai.copilot.enabled}
    knowledgeBase:
      enabled: ${bytechef.ai.knowledge-base.enabled:false}
  analytics:
    enabled: ${bytechef.analytics.enabled:false}
    postHog:
      apiKey: ${bytechef.analytics.postHog.apiKey:}
      host: ${bytechef.analytics.postHog.host:}
  application:
    edition: ${bytechef.edition:}
  docs:
    changelogUrl: ${docs.changelog-url:}
    communitySupportUrl: ${docs.community-support-url:}
    documentationUrl: ${docs.documentation-url:}
    reportBugUrl: ${docs.report-bug-url:}
  featureFlags: ${bytechef.feature-flags}
  helpHub:
    enabled: ${bytechef.helpHub.enabled:false}
    commandBar:
      orgId: ${bytechef.helpHub.commandBar.orgId:}
  signUp:
    activationRequired: ${bytechef.sign-up.activation-required}
    enabled: ${bytechef.sign-up.enabled}
  userGuiding:
    containerId: ${bytechef.userGuiding.containerId:}
    enabled: ${bytechef.userGuiding.enabled:false}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  info:
    git:
      mode: full
    env:
      enabled: true
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${bytechef.observability.tracing.endpoint}
    logging:
      export:
        otlp:
          endpoint: ${bytechef.observability.logging.endpoint}
  logging:
    export:
      enabled: ${bytechef.observability.logging.enabled}
  tracing:
    export:
      enabled: ${bytechef.observability.tracing.enabled}
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: ${bytechef.observability.metrics.enabled}
        step: 10s
        url: ${bytechef.observability.metrics.endpoint}

openapi:
  openAPIDefinition:
    base-path:
      automation: /api/automation
      embedded: /api/embedded
      platform: /api/platform

spring:
  cloud:
    redis:
      discovery:
        instanceId: ${spring.application.name}:${random.value}
  h2:
    console:
      enabled: false
  jmx:
    enabled: false
  mvc:
    async:
      request-timeout: 10m
  output:
    ansi:
      console-available: true
    group:
      dev:
        - dev
        - api-docs
  rabbitmq:
    listener:
      direct:
        prefetch: 1
  task:
    execution:
      simple:
        concurrency-limit: ${bytechef.async.concurrency-limit}
  threads:
    virtual:
      enabled: true

#####

bytechef:
  ai:
    copilot:
      enabled: false
      # Default LLM provider of the Copilot when the user has not selected one; empty uses the catalog default
      provider:
    firecrawl:
      base-url: https://api.firecrawl.dev/v2
      enabled: false
    knowledge-base:
      enabled: false
      # Number of concurrent consumers per knowledge base message route (used by AMQP | JMS brokers)
      subscriptions:
        document-chunk-update-events: 1
        document-process-events: 1
    memory:
      aws:
        bucket-prefix: bytechef-chat-memory
        key-prefix: ""
        session-bucket-prefix: bytechef-session
      redis:
        host: localhost
        port: 6379
        session-key-prefix: "bytechef-session:"
      session-max-archived-events: 1000
    provider:
      chat:
        anthropic:
          options:
            model: claude-sonnet-4-6
            temperature: 0.5
        deep-seek:
          options:
            model: deepseek-chat
        groq:
          options:
            model: llama-3.3-70b-versatile
        mistral:
          options:
            model: mistral-large-latest
        nvidia:
          options:
            model: meta/llama-3.1-70b-instruct
        openai:
          options:
            model: gpt-5.1
            temperature: 1
            reasoning-effect: MEDIUM
            verbosity: LOW
        perplexity:
          options:
            model: sonar
        vertex-gemini:
          options:
            model: gemini-2.5-pro
      embedding:
        mistral:
          options:
            model: mistral-embed
        openai:
          options:
            model: text-embedding-3-small
      image:
        openai:
          options:
            model: dall-e-3
  async:
    # Upper bound on concurrent @Async tasks on the default executor. There is no queue: a submitter waits for a
    # permit. Workflow task and trigger execution are bounded separately by bytechef.worker.task.*.
    concurrency-limit: 200
  cache:
    # Cache provider (CAFFEINE) default: CAFFEINE
    provider: CAFFEINE
  coordinator:
    # Whether this instance runs the coordinator (orchestrates job and trigger execution)
    enabled: true
    task:
      # Number of concurrent consumers per coordinator task message route (used by AMQP | JMS brokers)
      subscriptions:
        application-events: 1
        resume-job-events: 1
        start-job-events: 1
        stop-job-events: 1
        task-execution-complete-events: 1
        task-execution-error-events: 1
    trigger:
      polling:
        # Trigger polling interval in minutes (default: 5)
        check-period: 5
      # Number of concurrent consumers per coordinator trigger message route (used by AMQP | JMS brokers)
      subscriptions:
        application-events: 1
        trigger-execution-complete-events: 1
        trigger-execution-error-events: 1
        trigger-listener-events: 1
        trigger-poll-events: 1
        trigger-webhook-events: 1
  data-storage:
    # Data storage provider (AWS(EE) | FILESYSTEM | JDBC) default: JDBC
    provider: JDBC
  # Microservice discovery service provider (REDIS). Required for api-gateway routing and remote worker calls.
  discovery-service:
    provider: REDIS
  # Edition (CE - Community Edition | EE - Enterprise Edition) default: EE
  edition: EE
  # Encryption key provider (FILESYSTEM - the key generated on filesystem, PROPERTY - the key read from property) default: FILESYSTEM
  encryption:
    provider: FILESYSTEM
  file-storage:
    # File storage provider (AWS(EE) | FILESYSTEM | JDBC) default: FILESYSTEM
    provider: FILESYSTEM
    filesystem:
      basedir: ${user.home}/bytechef/data/file-storage
  # Enabled feature flags, e.g. [ff-123, ff-456]
  feature-flags: []
  mail:
    base-url: ${bytechef.public-url}
    from: noreply@app.bytechef.io
    # SMTP host; empty disables the mail health check and logs that mail is not configured
    host:
  message-broker:
    aws:
      # Transport for CONTROL routes, which must reach every node (REDIS | SQS) default: SQS
      control-provider: SQS
    # Messaging provider between Coordinator and Workers (AMQP | JMS | KAFKA | REDIS) default: REDIS
    provider: REDIS
  oauth2:
    #    predefinedApps:
    #      mailchimp:
    #        clientId: 123456789
    #        clientSecret: 123456789
    redirect-uri: ${bytechef.public-url}/callback
  observability:
    logging:
      aws:
        # Sign OTLP log export requests with AWS SigV4 (CloudWatch OTLP endpoint https://logs.{region}.amazonaws.com/v1/logs).
        enabled: false
        # AWS service name used in the SigV4 signature scope
        service: logs
      enabled: false
      endpoint: http://localhost:4318/v1/logs
    metrics:
      enabled: false
      endpoint: http://localhost:4318/v1/metrics
    tracing:
      enabled: false
      endpoint: http://localhost:4318/v1/traces
  public-url: http://127.0.0.1:5173
  resources:
    web: file:///opt/bytechef/client/
  scheduler:
    # Trigger scheduler provider (AWS(EE) | QUARTZ) default: QUARTZ
    provider: QUARTZ
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://storage.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; script-src: https://*.command.ai; frame-src: https://*.command.ai; img-src: https://*.command.ai; media-src: https://*.command.ai; connect-src: https://*.command.ai; style-src: https://*.command.ai;"
  sign-up:
    activation-required: false
    enabled: true
  # Tenant support mode (SINGLE | MULTI - EE only) default: SINGLE
  tenant:
    mode: SINGLE
  webhook-url: http://127.0.0.1:7888/webhooks/{id}
  # When the worker is enabled, subscribe to the default "default" queue with 10 concurrent consumers.
  # You may also route workflow tasks to other arbitrarily named task queues by specifying the "node"
  # property on any given task.
  # E.g. node: captions will route to the captions queue which a worker would subscribe to with workflow.worker.subscriptions.captions.
  # Note: queue must be created before tasks can be routed to it. ByteChef will create the queue if it isn't already there when the worker
  # bootstraps.
  worker:
    # Whether this instance runs the worker (executes workflow tasks and triggers)
    enabled: true
    task:
      subscriptions:
        default: 10
      # Concurrent executions in the synchronous, interactive lane (API Platform sync path, editor Test button)
      sync-concurrency-limit: 5
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      # Output storage provider for workflow output data (AWS(EE) | FILESYSTEM | JDBC) default: JDBC
      provider: JDBC
    repository:
      classpath:
        enabled: false
      filesystem:
        enabled: false
      git:
        enabled: false
      jdbc:
        enabled: true
    test-output:
      # Maximum number of items kept from each list in an output saved by Test Action in the workflow editor
      max-sample-items: 100
