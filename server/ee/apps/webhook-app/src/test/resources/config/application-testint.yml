server:
  port: 9999

bytechef:
  edition: EE
  message-broker:
    provider: MEMORY
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  oauth2:
    redirect-uri:
  remote:
    grpc:
      plaintext: true
      service-token: test-service-token
  workflow:
    output-storage:
      provider: JDBC
