server:
  port: 9999

bytechef:
  edition: EE
  message-broker:
    provider: MEMORY
  file-storage:
    filesystem:
      basedir: ${java.io.tmpdir}/bytechef/file-storage
    provider: JDBC
  oauth2:
    redirect-uri:
  worker:
    enabled: false
  workflow:
    output-storage:
      provider: JDBC
