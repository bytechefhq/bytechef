server:
  port: 9999

openapi:
  openAPIDefinition:
    base-path:
      automation: /api/automation
      embedded: /api/embedded
      platform: /api/platform

spring:
  grpc:
    server:
      port: 0
  graphql:
    schema:
      locations: classpath*:graphql/**/
  liquibase:
    contexts: configuration

bytechef:
  encryption:
    provider: FILESYSTEM
  edition: EE
  file-storage:
    provider: JDBC
  remote:
    grpc:
      plaintext: true
      service-token: test-service-token
  webhook-delivery:
    concurrency-limit: 10
    max-pending-deliveries: 1000
  workflow:
    repository:
      jdbc:
        enabled: true
    output-storage:
      provider: JDBC
