spring:
  application:
    name: configuration-app
  config:
    import:
      - classpath:config/microservice.yml
      - classpath:config/configuration-app.yml
  profiles:
    active: #spring.profiles.active#
  mail:
    properties:
      mail:
        smtp:
          # Milliseconds; JavaMail waits forever by default and a test send runs on the request thread
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000
        smtps:
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000
