management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

spring:
  ai:
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${bytechef.ai.vectorstore.pgvector.dimensions}
        max-document-batch-size: 10000
        initialize-schema: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  graphql:
    schema:
      locations: classpath*:graphql/**/
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${bytechef.datasource.url}
    username: ${bytechef.datasource.username}
    password: ${bytechef.datasource.password}
    hikari:
      poolName: Hikari
  liquibase:
    contexts: configuration
  mail:
    host: ${bytechef.mail.host:localhost}
    port: ${bytechef.mail.port:25}
    username: ${bytechef.mail.username:}
    password: ${bytechef.mail.password:}
  task:
    execution:
      thread-name-prefix: configuration-app-task-

bytechef:
  ai:
    knowledge-base:
      ocr:
        provider: NONE
    vectorstore:
      provider: PGVECTOR
      pgvector:
        dimensions: 1536
  session:
    store: redis
  worker:
    enabled: false
