---
openapi: "3.0.1"
info:
  title: "The Automation Configuration Public V1 API"
  version: "1"
servers:
  - url: "/api/automation/v1"
tags:
  - name: "project-code-workflow"
    description: "The Automation Project Code Workflow Public API"
  - name: "project-git"
    description: "The Automation Project Git Public API"
paths:
  /projects/deploy:
    post:
      description: "Deploy a new code based project."
      summary: "Deploy a new code based project"
      tags:
        - "project-code-workflow"
      operationId: "deployProject"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "enable"
          description: "Whether to make the published project live in the environment: create and enable its\
            \ deployment when it has none there, otherwise move the existing one to the published version and\
            \ enable it."
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "workspaceId"
              properties:
                workspaceId:
                  description: "The id of a workspace this project will belong."
                  type: "integer"
                  format: "int64"
                projectFile:
                  description: "The file of a code-native project."
                  type: "string"
                  format: "binary"
        required: true
      responses:
        "204":
          description: "Successful operation."
  /projects/{id}/git/pull:
    post:
      description: "Pulls project from git repository."
      summary: "Pulls project from git repository."
      tags:
        - "project-git"
      operationId: "pullProjectFromGit"
      parameters:
        - name: "id"
          description: "The id of a project."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "Successful operation."
components:
  schemas:
    Environment:
      $ref: "../../../../../libs/platform/platform-rest/openapi/components/schemas/objects/environment.yaml"
