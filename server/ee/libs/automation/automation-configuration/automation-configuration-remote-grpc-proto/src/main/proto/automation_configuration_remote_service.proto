syntax = "proto3";

package bytechef.automation.configuration.remote.v1;

import "atlas_execution_remote_service.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "platform_configuration_remote_service.proto";

option java_multiple_files = true;
option java_package = "com.bytechef.ee.automation.configuration.remote.grpc.proto";

service ChildJobPrincipalFactoryRemoteService {
  rpc CreateChildJob(CreateChildJobRequest) returns (IdResponse);
}

service ProjectFacadeRemoteService {
  rpc GetWorkspaceProjectWorkflows(IdRequest) returns (RemoteProjectWorkflowDTOs);
}

service ProjectRemoteService {
  rpc GetProject(IdRequest) returns (RemoteProject);
  rpc GetProjectDeploymentProject(IdRequest) returns (RemoteProject);
  rpc GetProjects(google.protobuf.Empty) returns (RemoteProjects);
  rpc GetWorkflowProject(WorkflowIdRequest) returns (RemoteProject);
}

service ProjectDeploymentRemoteService {
  rpc GetProjectDeployment(IdRequest) returns (RemoteProjectDeployment);
  rpc GetProjectDeployments(IdsRequest) returns (RemoteProjectDeployments);
  rpc GetProjectDeploymentsByFilter(ProjectDeploymentsFilterRequest) returns (RemoteProjectDeployments);
  rpc IsProjectDeploymentEnabled(IdRequest) returns (BoolResponse);
}

service ProjectDeploymentWorkflowRemoteService {
  rpc FetchProjectDeploymentWorkflowConnection(ProjectDeploymentWorkflowRequest)
      returns (ProjectDeploymentWorkflowConnectionResult);
  rpc GetProjectDeploymentWorkflow(ProjectDeploymentWorkflowRequest) returns (RemoteProjectDeploymentWorkflow);
  rpc GetProjectDeploymentWorkflowConnections(ProjectDeploymentWorkflowRequest)
      returns (RemoteProjectDeploymentWorkflowConnections);
  rpc IsConnectionUsed(IdRequest) returns (BoolResponse);
  rpc IsProjectDeploymentWorkflowEnabled(ProjectDeploymentWorkflowRequest) returns (BoolResponse);
}

service ProjectWorkflowRemoteService {
  rpc FetchProjectWorkflowWorkflowId(WorkflowUuidRequest) returns (OptionalStringResponse);
  rpc GetLastWorkflowId(WorkflowUuidRequest) returns (StringResponse);
  rpc GetProjectUuidProjectWorkflows(ProjectWorkflowUuidRequest) returns (RemoteProjectWorkflows);
  rpc GetProjectWorkflowIds(IdRequest) returns (StringsResponse);
  rpc GetProjectWorkflowWorkflowId(WorkflowUuidRequest) returns (StringResponse);
  rpc GetProjectsProjectWorkflows(IdsRequest) returns (RemoteProjectWorkflows);
  rpc GetWorkflowProjectWorkflows(WorkflowIdsRequest) returns (RemoteProjectWorkflows);
  rpc GetWorkflowUuidProjectWorkflows(WorkflowUuidRequest) returns (RemoteProjectWorkflows);
}

service SubflowResolverRemoteService {
  rpc ResolveSubflow(ResolveSubflowRequest) returns (RemoteSubflow);
}

message IdRequest {
  int64 id = 1;
}

message IdResponse {
  int64 id = 1;
}

message CreateChildJobRequest {
  int64 parent_job_id = 1;
  bytechef.atlas.execution.remote.v1.RemoteJobParameters job_parameters = 2;
}

message ResolveSubflowRequest {
  string workflow_uuid = 1;
  string trigger_name = 2;
  bool editor_environment = 3;
}

message RemoteSubflow {
  string workflow_id = 1;
  string inputs_name = 2;
}

message IdsRequest {
  repeated int64 ids = 1;
}

message WorkflowIdRequest {
  string workflow_id = 1;
}

message WorkflowIdsRequest {
  repeated string workflow_ids = 1;
}

message ProjectWorkflowUuidRequest {
  optional int64 project_id = 1;
  string workflow_uuid = 2;
}

message ProjectDeploymentsFilterRequest {
  optional bool embedded = 1;
  optional string environment = 2;
  optional int64 project_id = 3;
  optional int64 tag_id = 4;
  optional int64 workspace_id = 5;
}

message ProjectDeploymentWorkflowRequest {
  int64 project_deployment_id = 1;
  string workflow_id = 2;
  optional string workflow_node_name = 3;
  optional string workflow_connection_key = 4;
}

message WorkflowUuidRequest {
  optional int64 project_deployment_id = 1;
  string workflow_uuid = 2;
}

message StringResponse {
  string value = 1;
}

message OptionalStringResponse {
  optional string value = 1;
}

message StringsResponse {
  repeated string values = 1;
}

message BoolResponse {
  bool value = 1;
}

message RemoteProject {
  optional int64 category_id = 1;
  optional string created_by = 2;
  optional google.protobuf.Timestamp created_date = 3;
  optional string description = 4;
  optional int64 id = 5;
  optional string last_modified_by = 6;
  optional google.protobuf.Timestamp last_modified_date = 7;
  optional string name = 8;
  repeated RemoteProjectVersion project_versions = 9;
  repeated int64 tag_ids = 10;
  optional string uuid = 11;
  optional int32 version = 12;
  optional int64 workspace_id = 13;
}

message RemoteProjects {
  repeated RemoteProject projects = 1;
}

message RemoteProjectVersion {
  optional string description = 1;
  optional google.protobuf.Timestamp published_date = 2;
  optional string status = 3;
  optional int32 version = 4;
}

message RemoteProjectDeployment {
  optional string created_by = 1;
  optional google.protobuf.Timestamp created_date = 2;
  optional string description = 3;
  optional bool enabled = 4;
  optional string environment = 5;
  optional int64 id = 6;
  optional string last_modified_by = 7;
  optional google.protobuf.Timestamp last_modified_date = 8;
  optional string name = 9;
  optional int64 project_id = 10;
  optional int32 project_version = 11;
  repeated int64 tag_ids = 12;
  optional int32 version = 13;
}

message RemoteProjectDeployments {
  repeated RemoteProjectDeployment project_deployments = 1;
}

message RemoteProjectWorkflow {
  optional string created_by = 1;
  optional google.protobuf.Timestamp created_date = 2;
  optional int64 id = 3;
  optional string last_modified_by = 4;
  optional google.protobuf.Timestamp last_modified_date = 5;
  optional int64 project_id = 6;
  optional int32 project_version = 7;
  optional string uuid = 8;
  optional int32 version = 9;
  optional string workflow_id = 10;
}

message RemoteProjectWorkflows {
  repeated RemoteProjectWorkflow project_workflows = 1;
}

message RemoteProjectWorkflowDTO {
  bytechef.platform.configuration.remote.v1.RemoteWorkflow workflow = 1;
  int32 project_version = 2;
  int64 project_workflow_id = 3;
  bool sse_stream_response = 4;
  optional string workflow_uuid = 5;
}

message RemoteProjectWorkflowDTOs {
  repeated RemoteProjectWorkflowDTO project_workflows = 1;
}

message RemoteProjectDeploymentWorkflow {
  repeated RemoteProjectDeploymentWorkflowConnection connections = 1;
  optional string created_by = 2;
  optional google.protobuf.Timestamp created_date = 3;
  optional bool enabled = 4;
  optional int64 id = 5;
  optional bytes inputs = 6;
  optional string last_modified_by = 7;
  optional google.protobuf.Timestamp last_modified_date = 8;
  optional int64 project_deployment_id = 9;
  optional int32 version = 10;
  optional string workflow_id = 11;
}

message RemoteProjectDeploymentWorkflowConnection {
  optional int64 connection_id = 1;
  optional string workflow_connection_key = 2;
  optional string workflow_node_name = 3;
}

message RemoteProjectDeploymentWorkflowConnections {
  repeated RemoteProjectDeploymentWorkflowConnection connections = 1;
}

message ProjectDeploymentWorkflowConnectionResult {
  optional RemoteProjectDeploymentWorkflowConnection connection = 1;
}
