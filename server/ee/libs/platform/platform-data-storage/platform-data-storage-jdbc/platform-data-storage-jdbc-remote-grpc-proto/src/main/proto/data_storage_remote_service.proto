syntax = "proto3";

package bytechef.platform.data.storage.remote.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.bytechef.ee.platform.data.storage.jdbc.remote.grpc.proto";

service JdbcDataStorageRemoteService {
  rpc Delete(DataStorageKeyRequest) returns (google.protobuf.Empty);
  rpc DeleteScopeData(DeleteScopeDataRequest) returns (google.protobuf.Empty);
  rpc Fetch(DataStorageKeyRequest) returns (FetchDataStorageValueResponse);
  rpc FetchVersioned(DataStorageKeyRequest) returns (FetchVersionedDataStorageValueResponse);
  rpc GetAll(DataStorageScopeRequest) returns (JsonValue);
  rpc Put(PutDataStorageValueRequest) returns (google.protobuf.Empty);
  rpc PutIfVersion(PutIfVersionDataStorageValueRequest) returns (PutIfVersionDataStorageValueResponse);
}

message DataStorageKeyRequest {
  string component_name = 1;
  string scope = 2;
  string scope_id = 3;
  string key = 4;
  int64 environment_id = 5;
  optional string type = 6;
}

message DataStorageScopeRequest {
  string component_name = 1;
  string scope = 2;
  string scope_id = 3;
  int64 environment_id = 4;
  optional string type = 5;
}

message DeleteScopeDataRequest {
  string scope = 1;
  string scope_id = 2;
  string type = 3;
}

message DataStorageEntryVersion {
  int64 id = 1;
  int32 version = 2;
}

message PutDataStorageValueRequest {
  DataStorageKeyRequest key = 1;
  bytes value = 2;
}

message FetchDataStorageValueResponse {
  optional bytes value = 1;
}

message FetchVersionedDataStorageValueResponse {
  optional VersionedDataStorageValue versioned_value = 1;
}

message VersionedDataStorageValue {
  bytes value = 1;
  DataStorageEntryVersion version = 2;
}

message PutIfVersionDataStorageValueRequest {
  DataStorageKeyRequest key = 1;
  bytes value = 2;
  optional DataStorageEntryVersion expected_version = 3;
}

message PutIfVersionDataStorageValueResponse {
  bool written = 1;
}

message JsonValue {
  bytes value = 1;
}
