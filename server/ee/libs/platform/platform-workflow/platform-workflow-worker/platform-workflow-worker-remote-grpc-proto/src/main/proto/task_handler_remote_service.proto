syntax = "proto3";

package bytechef.platform.workflow.worker.remote.v1;

import "atlas_execution_remote_service.proto";

option java_multiple_files = true;
option java_package = "com.bytechef.ee.platform.workflow.worker.remote.grpc.proto";

service TaskHandlerRemoteService {
  rpc Handle(HandleTaskRequest) returns (HandleTaskResponse);
}

message HandleTaskRequest {
  string type = 1;
  bytechef.atlas.execution.remote.v1.RemoteTaskExecution task_execution = 2;
}

message HandleTaskResponse {
  optional bytes output = 1;
}
