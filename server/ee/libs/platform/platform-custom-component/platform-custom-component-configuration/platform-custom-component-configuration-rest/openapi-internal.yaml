---
openapi: "3.0.1"
info:
  title: "The Platform Custom Component Internal API"
  version: "1"
servers:
  - url: "/api/platform/internal"
tags:
  - name: "custom-component-internal"
    description: "The Platform Custom Component Internal API"
paths:
  /custom-components/deploy:
    post:
      description: "Deploy a new custom component from the admin console. Session/cookie authenticated, unlike the bearer-token-only /api/platform/v1/custom-components/deploy endpoint."
      summary: "Deploy a new custom component"
      tags:
        - "custom-component-internal"
      operationId: "deployCustomComponentInternal"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                componentFile:
                  description: "The file of a custom component."
                  type: "string"
                  format: "binary"
        required: true
      responses:
        "204":
          description: "Successful operation."
