syntax = "proto3";

package bytechef.tenant.remote.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.bytechef.ee.tenant.remote.grpc.proto";

service TenantRemoteService {
  rpc GetTenantIds(google.protobuf.Empty) returns (TenantIdsResponse);
}

message TenantIdsResponse {
  repeated string tenant_ids = 1;
}
