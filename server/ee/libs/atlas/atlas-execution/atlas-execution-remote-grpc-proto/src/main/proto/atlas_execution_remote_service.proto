syntax = "proto3";

package bytechef.atlas.execution.remote.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.bytechef.ee.atlas.execution.remote.grpc.proto";

service JobFacadeRemoteService {
  rpc CreateJob(RemoteJobParameters) returns (IdResponse);
  rpc DeleteJob(IdRequest) returns (google.protobuf.Empty);
  rpc ResumeApproval(ResumeApprovalRequest) returns (google.protobuf.Empty);
  rpc ResumeClaimedJob(ResumeJobRequest) returns (google.protobuf.Empty);
  rpc ResumeJob(ResumeJobRequest) returns (google.protobuf.Empty);
  rpc StopJob(IdRequest) returns (google.protobuf.Empty);
}

service JobRemoteService {
  rpc FetchJob(IdRequest) returns (JobResult);
  rpc FetchLastWorkflowJob(WorkflowIdRequest) returns (JobResult);
  rpc FetchTaskExecutionJob(IdRequest) returns (JobResult);
  rpc GetChildJobIds(IdRequest) returns (Int64ListResponse);
  rpc GetJob(IdRequest) returns (RemoteJob);
  rpc GetStaleJobs(StaleJobsRequest) returns (RemoteJobs);
  rpc GetTaskExecutionJob(IdRequest) returns (RemoteJob);
  rpc ResumeToStatusStarted(IdRequest) returns (RemoteJob);
  rpc SetStatusToStarted(IdRequest) returns (RemoteJob);
  rpc SetStatusToStopped(IdRequest) returns (RemoteJob);
  rpc TryClaimResume(RemoteJob) returns (BoolResponse);
  rpc Update(RemoteJob) returns (RemoteJob);
}

service TaskExecutionRemoteService {
  rpc CancelIfUnfinished(IdRequest) returns (BoolResponse);
  rpc CompleteIfNotCancelled(IdRequest) returns (BoolResponse);
  rpc Create(RemoteTaskExecution) returns (RemoteTaskExecution);
  rpc FetchLastJobTaskExecution(IdRequest) returns (TaskExecutionResult);
  rpc GetJobTaskExecutions(IdRequest) returns (RemoteTaskExecutions);
  rpc GetJobUnfinishedTaskExecutions(IdRequest) returns (RemoteTaskExecutions);
  rpc GetParentTaskExecutions(IdRequest) returns (RemoteTaskExecutions);
  rpc GetTaskExecution(IdRequest) returns (RemoteTaskExecution);
  rpc GetTaskExecutionForUpdate(IdRequest) returns (RemoteTaskExecution);
  rpc Update(RemoteTaskExecution) returns (RemoteTaskExecution);
}

service ContextRemoteService {
  rpc Peek(ContextKeyRequest) returns (RemoteFileEntry);
  rpc Push(PushContextRequest) returns (google.protobuf.Empty);
}

service CounterRemoteService {
  rpc Decrement(IdRequest) returns (Int64Response);
  rpc Delete(IdRequest) returns (google.protobuf.Empty);
  rpc Set(SetCounterRequest) returns (google.protobuf.Empty);
}

message IdRequest {
  int64 id = 1;
}

message ResumeApprovalRequest {
  int64 job_id = 1;
  string uuid = 2;
  bool approved = 3;
}

message ResumeJobRequest {
  int64 job_id = 1;
  optional int64 task_execution_id = 2;
  bytes data = 3;
}

message IdResponse {
  int64 id = 1;
}

message Int64Response {
  int64 value = 1;
}

message BoolResponse {
  bool value = 1;
}

message Int64ListResponse {
  repeated int64 values = 1;
}

message StaleJobsRequest {
  string status = 1;
  google.protobuf.Timestamp last_modified_date_before = 2;
}

message WorkflowIdRequest {
  string workflow_id = 1;
}

message ContextKeyRequest {
  int64 stack_id = 1;
  optional int32 sub_stack_id = 2;
  string classname = 3;
}

message PushContextRequest {
  ContextKeyRequest key = 1;
  RemoteFileEntry value = 2;
}

message SetCounterRequest {
  int64 id = 1;
  int64 value = 2;
}

message JobResult {
  optional RemoteJob job = 1;
}

message RemoteJob {
  optional string created_by = 1;
  optional google.protobuf.Timestamp created_date = 2;
  optional int32 current_task = 3;
  optional google.protobuf.Timestamp end_date = 4;
  optional RemoteExecutionError error = 5;
  optional int64 id = 6;
  optional bytes inputs = 7;
  optional string label = 8;
  optional string last_modified_by = 9;
  optional google.protobuf.Timestamp last_modified_date = 10;
  optional bytes metadata = 11;
  optional RemoteFileEntry outputs = 12;
  optional int64 parent_task_execution_id = 13;
  optional int32 priority = 14;
  optional google.protobuf.Timestamp start_date = 15;
  optional string status = 16;
  optional int32 version = 17;
  repeated RemoteWebhook webhooks = 18;
  optional string workflow_id = 19;
}

message RemoteJobs {
  repeated RemoteJob jobs = 1;
}

message RemoteJobParameters {
  optional bytes inputs = 1;
  optional string label = 2;
  optional bytes metadata = 3;
  optional int64 parent_task_execution_id = 4;
  optional int32 priority = 5;
  repeated RemoteWebhook webhooks = 6;
  optional string workflow_id = 7;
}

message RemoteWebhook {
  optional RemoteWebhookRetry retry = 1;
  optional string type = 2;
  optional string url = 3;
}

message RemoteWebhookRetry {
  optional int32 initial_interval = 1;
  optional int32 max_attempts = 2;
  optional int32 max_interval = 3;
  optional int32 multiplier = 4;
}

message TaskExecutionResult {
  optional RemoteTaskExecution task_execution = 1;
}

message RemoteTaskExecutions {
  repeated RemoteTaskExecution task_executions = 1;
}

message RemoteTaskExecution {
  optional google.protobuf.Timestamp end_date = 1;
  optional RemoteExecutionError error = 2;
  optional int64 execution_time = 3;
  optional bool handled = 4;
  optional int64 id = 5;
  optional int64 job_id = 6;
  optional int32 max_retries = 7;
  optional bytes metadata = 8;
  optional bool new = 9;
  optional RemoteFileEntry output = 10;
  optional int64 parent_id = 11;
  optional int32 priority = 12;
  optional int32 progress = 13;
  optional int32 retry_attempts = 14;
  optional string retry_delay = 15;
  optional int32 retry_delay_factor = 16;
  reserved 17;
  reserved "retry_delay_millis";
  optional google.protobuf.Timestamp start_date = 18;
  optional string status = 19;
  optional int32 task_number = 20;
  optional bytes workflow_task = 21;
  optional string created_by = 22;
  optional google.protobuf.Timestamp created_date = 23;
  optional string last_modified_by = 24;
  optional google.protobuf.Timestamp last_modified_date = 25;
}

message RemoteExecutionError {
  optional string message = 1;
  repeated string stack_trace = 2;
}

message RemoteFileEntry {
  optional string extension = 1;
  optional string mime_type = 2;
  optional string name = 3;
  optional string url = 4;
}
