---
openapi: "3.0.1"
info:
  title: "The Embedded Connected User Internal API"
  version: "1"
servers:
  - url: "/api/embedded/internal"
tags:
  - name: "connected-user"
    description: "The Embedded Connected User Internal API"
paths:
  /connected-users:
    get:
      description: "Get all connected users."
      summary: "Get all connected users"
      tags:
        - "connected-user"
      operationId: "getConnectedUsers"
      parameters:
        - name: "environmentId"
          description: "The environment id."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "credentialStatus"
          description: "The id of an integration instance."
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/CredentialStatus"
        - name: "createDateFrom"
          description: "The start range of a create date."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "createDateTo"
          description: "The end range of a create date ."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "integrationId"
          description: "The id of an integration."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "pageNumber"
          description: "The number of the page to return."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
        - name: "search"
          description: "The name, email or external reference code of a connected user."
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "The page of connected users."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
    post:
      description: "Create a connected user."
      summary: "Create a connected user"
      tags:
        - "connected-user"
      operationId: "createConnectedUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectedUserRequest"
      responses:
        "200":
          description: "The created connected user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedUser"
  /connected-users/import:
    post:
      description: "Import connected users from a CSV file."
      summary: "Import connected users from a CSV file"
      tags:
        - "connected-user"
      operationId: "importConnectedUsers"
      parameters:
        - name: "environmentId"
          description: "The environment id."
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "file"
              properties:
                file:
                  description: "The CSV file."
                  type: "string"
                  format: "binary"
      responses:
        "200":
          description: "The import result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedUserImportResult"
  /connected-users/{id}:
    get:
      description: "Get a connected user."
      summary: "Get a connected user"
      tags:
        - "connected-user"
      operationId: "getConnectedUser"
      parameters:
        - name: "id"
          description: "The id of an integration instance."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "A connection object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedUser"
    put:
      description: "Update a connected user."
      summary: "Update a connected user"
      tags:
        - "connected-user"
      operationId: "updateConnectedUser"
      parameters:
        - name: "id"
          description: "The id of a connected user."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectedUserRequest"
      responses:
        "200":
          description: "The updated connected user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedUser"
    delete:
      description: "Delete a connected user."
      summary: "Delete a connected user"
      tags:
        - "connected-user"
      operationId: "deleteConnectedUser"
      parameters:
        - name: "id"
          description: "The id of an integration instance configuration."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "Successful operation."
  /connected-users/{id}/enable/{enable}:
    patch:
      description: "Enable/disable a connected user."
      summary: "Enable/disable a connected user"
      tags:
        - "connected-user"
      operationId: "enableConnectedUser"
      parameters:
        - name: "id"
          description: "The id of a connected user."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "enable"
          description: "Enable/disable the connected user."
          in: "path"
          required: true
          schema:
            type: "boolean"
      responses:
        "204":
          description: "Successful operation."
components:
  schemas:
    ConnectedUser:
      type: "object"
      required:
        - "externalId"
      properties:
        createdBy:
          description: "The created by."
          type: "string"
          readOnly: true
        createdDate:
          description: "The created date."
          type: "string"
          format: "date-time"
          readOnly: true
        email:
          description: "The email address."
          type: "string"
        enabled:
          description: "If a connected user is enabled or not"
          type: "boolean"
        environmentId:
          description: "The id of an environment."
          type: "integer"
          format: "int64"
        externalId:
          description: "The connected user external id."
          type: "string"
          readOnly: true
        id:
          description: "The id of a connected user."
          type: "integer"
          format: "int64"
          readOnly: true
        integrationInstances:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedUserIntegrationInstance"
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
        name:
          description: "The name of a connection."
          type: "string"
        lastModifiedBy:
          description: "The last modified by."
          type: "string"
          readOnly: true
        lastModifiedDate:
          description: "The last modified date."
          type: "string"
          format: "date-time"
          readOnly: true
        __version:
          type: "integer"
          format: "int32"
    ConnectedUserIntegrationInstance:
      type: object
      properties:
        componentName:
          description: "The name of a component."
          type: "string"
        enabled:
          description: "If an integration's instance is enable dor not."
          type: "boolean"
        id:
          description: "The id of an integration instance."
          type: "integer"
          format: "int64"
          readOnly: true
        integrationId:
          description: "The id of an integration."
          type: "integer"
          format: "int64"
          readOnly: true
        integrationInstanceConfigurationId:
          description: "The id of an integration instance configuration."
          type: "integer"
          format: "int64"
          readOnly: true
        integrationVersion:
          description: "The version of an integration."
          type: "integer"
          readOnly: true
        connectionId:
          description: "The id of a connection."
          type: "integer"
          format: "int64"
          readOnly: true
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
    ConnectedUserImportResult:
      type: "object"
      properties:
        createdCount:
          description: "The number of created connected users."
          type: "integer"
          format: "int32"
        rejectedRows:
          description: "The rows that were rejected."
          type: "array"
          items:
            $ref: "#/components/schemas/ConnectedUserImportRejectedRow"
        skippedExternalIds:
          description: "The external ids that already existed or were repeated."
          type: "array"
          items:
            type: "string"
    ConnectedUserImportRejectedRow:
      type: "object"
      properties:
        reason:
          description: "The reason the row was rejected."
          type: "string"
        rowNumber:
          description: "The number of the rejected row."
          type: "integer"
          format: "int32"
    CreateConnectedUserRequest:
      type: "object"
      required:
        - "environmentId"
        - "externalId"
      properties:
        email:
          description: "The email address."
          type: "string"
        environmentId:
          description: "The id of an environment."
          type: "integer"
          format: "int64"
        externalId:
          description: "The connected user external id."
          type: "string"
        metadata:
          description: "The metadata."
          type: "object"
          additionalProperties:
            type: "string"
        name:
          description: "The name of a connected user."
          type: "string"
    UpdateConnectedUserRequest:
      type: "object"
      required:
        - "version"
      properties:
        email:
          description: "The email address."
          type: "string"
        metadata:
          description: "The metadata."
          type: "object"
          additionalProperties:
            type: "string"
        name:
          description: "The name of a connected user."
          type: "string"
        version:
          description: "The version of the connected user being edited."
          type: "integer"
          format: "int32"
    CredentialStatus:
      $ref: "../../../../../libs/platform/platform-connection/platform-connection-rest/openapi/components/schemas/objects/credential_status.yaml"
    Page:
      $ref: "../../../../../libs/platform/platform-rest/openapi/components/schemas/objects/page.yaml"
