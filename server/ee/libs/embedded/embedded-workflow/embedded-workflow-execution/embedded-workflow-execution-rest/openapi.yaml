---
openapi: "3.0.1"
info:
  title: "Embedded Execution Internal API"
  version: "1"
servers:
  - url: "/api/embedded/internal"
tags:
  - name: "workflow-execution"
    description: "The Embedded Workflow Execution Internal API"
paths:
  /workflow-executions:
    get:
      description: "Get Integration workflow executions."
      summary: "Get Integration workflow executions"
      tags:
        - "workflow-execution"
      operationId: "getWorkflowExecutionsPage"
      parameters:
        - name: "environmentId"
          description: "The id of an environment."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "jobStatus"
          description: "The status of an executed job"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "CREATED"
              - "STARTED"
              - "STOPPED"
              - "FAILED"
              - "COMPLETED"
        - name: "jobStartDate"
          description: "The start date of a job."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "jobEndDate"
          description: "The end date of a job."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "integrationId"
          description: "The id of a Integration."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "integrationInstanceConfigurationId"
          description: "The id of a Integration instance configuration."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "connectedUserId"
          description: "The id of a connected user."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "workflowId"
          description: "The id of a workflow."
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "pageNumber"
          description: "The number of the page to return."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
      responses:
        "200":
          description: "The page of workflow executions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
  /workflow-executions/{id}:
    get:
      description: "Get workflow execution by id."
      summary: "Get workflow executions by id"
      tags:
        - "workflow-execution"
      operationId: "getWorkflowExecution"
      parameters:
        - name: "id"
          description: "The id of an execution."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "lazy"
          description: "Whether to return only the top-level task executions, with their child counts, the focus path and the latest-attempt task execution count. Child jobs of subflow tasks are returned without their task executions."
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: false
      responses:
        "200":
          description: "The execution object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
  /workflow-executions/{id}/task-executions/{taskExecutionId}:
    get:
      description: "Get a single task execution's input and output by id."
      summary: "Get a task execution by id"
      tags:
        - "workflow-execution"
      operationId: "getWorkflowExecutionTaskExecution"
      parameters:
        - name: "id"
          description: "The id of an execution."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "taskExecutionId"
          description: "The id of a task execution."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "The task execution object."
          content:
            application/json:
              schema:
                $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/TaskExecution"
  /workflow-executions/{id}/task-executions/{taskExecutionId}/children:
    get:
      description: "Get a page of the children of a task execution of the execution or of one of its subflow jobs. A loop returns whole iterations, an on-error task returns its two branches on a single page."
      summary: "Get a page of task execution children"
      tags:
        - "workflow-execution"
      operationId: "getWorkflowExecutionTaskExecutionChildren"
      parameters:
        - name: "id"
          description: "The id of an execution."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "taskExecutionId"
          description: "The id of a task execution."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "pageNumber"
          description: "The zero-based number of the page to return."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
            minimum: 0
        - name: "pageSize"
          description: "The number of children or loop iterations per page, from 1 to 200. An on-error task returns both of its branches on page 0 whatever the page size."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "The page of task execution children."
          content:
            application/json:
              schema:
                $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/TaskExecutionChildrenPage"
components:
  schemas:
    Page:
      $ref: "../../../../../../libs/platform/platform-rest/openapi/components/schemas/objects/page.yaml"
    WorkflowExecution:
      description: "Contains information about execution of a Integration workflow."
      type: "object"
      required:
        - "id"
        - "integration"
        - "integrationInstanceConfiguration"
        - "integrationInstance"
        - "job"
        - "workflow"
      properties:
        focusPath:
          description: "The path from a top-level task execution to the task execution to focus, set when the execution is loaded lazily. It ends at the earliest failed leaf task execution that was not retried, under the latest attempt of its top-level task, else at the last started or last created task execution. It is empty when no such task execution can be resolved, for example when the job has no task executions. When it is set, the job's task executions are the top-level ones only and their children are loaded through the children endpoint."
          type: "array"
          items:
            $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/FocusPathElement"
        id:
          description: "The id of a workflow execution."
          type: "integer"
          format: "int64"
          readOnly: true
        integration:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationBasic"
        integrationInstanceConfiguration:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationInstanceConfiguration"
        integrationInstance:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationInstanceBasic"
        job:
          $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/Job"
        taskExecutionCount:
          description: "The number of task executions of this job, counting only the latest attempt of each task, including the task executions of every loop iteration and branch and excluding subflow jobs; set when the execution is loaded lazily."
          type: "integer"
          format: "int64"
          readOnly: true
        triggerExecution:
          $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/TriggerExecution"
        workflow:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/WorkflowBasic"
    WorkflowExecutionBasic:
      description: "Contains information about execution of a Integration workflow."
      type: "object"
      required:
        - "id"
        - "integration"
        - "integrationInstanceConfiguration"
        - "integrationInstance"
        - "job"
        - "workflow"
      properties:
        id:
          description: "The id of a workflow execution."
          type: "integer"
          format: "int64"
          readOnly: true
        integration:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationBasic"
        integrationInstanceConfiguration:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationInstanceConfigurationBasic"
        integrationInstance:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/IntegrationInstanceBasic"
        job:
          $ref: "../../../../../../libs/platform/platform-workflow/platform-workflow-execution/platform-workflow-execution-rest/platform-workflow-execution-rest-impl/openapi.yaml#/components/schemas/JobBasic"
        workflow:
          $ref: "../../../embedded-configuration/embedded-configuration-rest/embedded-configuration-rest-impl/openapi.yaml#/components/schemas/WorkflowBasic"
