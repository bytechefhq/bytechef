    Tool:
      type: "object"
      required:
        - function
        - type
      properties:
        function:
          $ref: "#/components/schemas/Function"
        type:
          description: The type of the tool
          type: "string"
          default: "function"
    ExternalInvocation:
      description: "A record of a single external invocation."
      type: "object"
      properties:
        componentName:
          description: "The name of the component the tool belongs to."
          type: "string"
        componentVersion:
          description: "The version of the component the tool belongs to."
          type: "integer"
          format: "int32"
        createdDate:
          description: "When the invocation was recorded."
          type: "string"
          format: "date-time"
        durationMs:
          description: "How long the invocation took, in milliseconds."
          type: "integer"
          format: "int32"
        errorMessage:
          description: "The error message of a failed invocation."
          type: "string"
        errorType:
          description: "The error type of a failed invocation."
          type: "string"
        id:
          description: "The id of the invocation record."
          type: "integer"
          format: "int64"
        integrationInstanceId:
          description: "The id of the integration instance the invocation ran on."
          type: "integer"
          format: "int64"
        jobId:
          description: "The id of the workflow run a workflow tool started."
          type: "integer"
          format: "int64"
        kind:
          $ref: "#/components/schemas/ExternalInvocationKind"
        operationName:
          description: "The name of the action or cluster element the tool ran."
          type: "string"
        outcome:
          $ref: "#/components/schemas/ExternalInvocationOutcome"
        source:
          $ref: "#/components/schemas/ExternalInvocationSource"
        toolName:
          description: "The name of the tool."
          type: "string"
    ExternalInvocationKind:
      description: "What a external invocation ran."
      type: "string"
      enum:
        - "COMPONENT"
        - "WORKFLOW"
    ExternalInvocationOutcome:
      description: "The outcome of a external invocation."
      type: "string"
      enum:
        - "SUCCESS"
        - "ERROR"
        - "CONNECTION_REQUIRED"
        - "TIMEOUT"
        - "APPROVAL_REQUIRED"
        - "APPROVAL_DENIED"
        - "RULE_BLOCKED"
        - "SUSPENDED"
    ExternalInvocationPage:
      description: "A page of a connected user's external invocations."
      type: "object"
      properties:
        content:
          description: "The external invocations on this page."
          type: "array"
          items:
            $ref: "#/components/schemas/ExternalInvocation"
        number:
          description: "The current page."
          type: "integer"
        numberOfElements:
          description: "The number of elements."
          type: "integer"
        size:
          description: "The size of the page."
          type: "integer"
        totalElements:
          description: "The total number of elements."
          type: "integer"
        totalPages:
          description: "The total number of pages."
          type: "integer"
    ExternalInvocationSource:
      description: "The source a external invocation was made through."
      type: "string"
      enum:
        - "MCP_SERVER"
        - "API_ACTION"
        - "API_TOOL"
        - "A2A_SERVER"
        - "API_TRIGGER"
    Trigger:
      description: "A component trigger a connected user can subscribe to."
      type: "object"
      required:
        - hasDynamicOutput
        - inputSchema
        - name
        - title
        - type
      properties:
        description:
          description: "The description of what the trigger does."
          type: "string"
        hasDynamicOutput:
          description: "Indicates that the structure of the output depends on the input."
          type: "boolean"
        inputSchema:
          description: "JSON Schema for the trigger input parameters."
          type: "string"
        name:
          description: "The programmatic name of the trigger, used when creating a trigger subscription."
          type: "string"
        outputSchema:
          description: "JSON Schema for the trigger output, when the output structure is static and an object."
          type: "string"
        title:
          description: "The full title of the trigger."
          type: "string"
        type:
          description: "The type of the trigger: STATIC_WEBHOOK, DYNAMIC_WEBHOOK, POLLING, HYBRID, LISTENER or CALLABLE."
          type: "string"
    TriggerSubscription:
      description: "A subscription of a connected user to a component trigger."
      type: "object"
      required:
        - componentName
        - componentVersion
        - createdDate
        - id
        - input
        - lastModifiedDate
        - status
        - triggerName
      properties:
        componentName:
          description: "The name of the component which contains the trigger."
          type: "string"
        componentVersion:
          description: "The version of the component."
          type: "integer"
        createdDate:
          description: "When the subscription was created."
          type: "string"
          format: "date-time"
        error:
          $ref: "#/components/schemas/TriggerSubscriptionError"
        externalId:
          description: "Your own id for the subscription. It is echoed in every event."
          type: "string"
        id:
          description: "The unique id of the subscription."
          type: "integer"
          format: "int64"
        input:
          description: "The input parameters for the trigger."
          type: object
          additionalProperties: true
        lastDeliveryError:
          description: "The error of the last event delivery, or null when it succeeded. Cut to 1024 characters."
          type: "string"
        lastDeliveryStatus:
          description: "The status of the last event delivery: SENT, FAILED or DROPPED."
          type: "string"
        lastEventDate:
          description: "When the last trigger event was produced, whether or not it was delivered."
          type: "string"
          format: "date-time"
        lastModifiedDate:
          description: "When the subscription was last modified."
          type: "string"
          format: "date-time"
        name:
          description: "The name of the subscription, e.g. Mailchimp subscription."
          type: "string"
        staticWebhookUrl:
          description: "The ByteChef URL to register in the app; only for static webhook triggers."
          type: "string"
        status:
          $ref: "#/components/schemas/TriggerSubscriptionStatus"
        triggerName:
          description: "The name of the trigger."
          type: "string"
        webhookUrl:
          description: "The URL where trigger events of this subscription are delivered, when it overrides the\
            \ environment webhook URL."
          type: "string"
    TriggerSubscriptionError:
      description: "Details about the error that made the subscription fail."
      type: "object"
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/TriggerSubscriptionErrorCode"
        message:
          description: "The error message."
          type: "string"
    TriggerSubscriptionErrorCode:
      description: "The code of a trigger subscription error."
      type: "string"
      enum:
        - "USER_INPUT_ERROR"
        - "API_ERROR"
        - "TIMEOUT_ERROR"
        - "OAUTH_REFRESH"
        - "NO_TRIGGER"
        - "INTERNAL_ERROR"
    TriggerSubscriptionFailure:
      description: "An error of a trigger subscription operation. errors[].code is a trigger subscription error code\
        \ (USER_INPUT_ERROR, API_ERROR, TIMEOUT_ERROR, OAUTH_REFRESH, NO_TRIGGER, INTERNAL_ERROR) or NOT_FOUND."
      type: "object"
      required:
        - errors
      properties:
        errors:
          $ref: "#/components/schemas/Errors"
        triggerSubscriptionId:
          description: "The id of the subscription whose trigger could not be registered, unregistered or redeployed\
            \ on enable or update. Absent for validation errors, NO_TRIGGER and NOT_FOUND, when a subscribe call\
            \ failed and the subscription was removed, and when an update of a subscription that was not ENABLED\
            \ failed."
          type: "integer"
          format: "int64"
    TriggerSubscriptionRequest:
      description: "The parameters of a trigger subscription."
      type: "object"
      required:
        - input
      properties:
        externalId:
          description: "Your own id for the subscription. It is echoed in every event."
          type: "string"
        input:
          description: "The input parameters for the trigger. Values are literals; expressions are not allowed."
          type: object
          additionalProperties: true
        name:
          description: "The name of the subscription, e.g. Mailchimp subscription."
          type: "string"
        webhookUrl:
          description: "The URL where trigger events of this subscription are delivered. Overrides the\
            \ environment webhook URL; events are still signed with the environment signing secret. Only a call\
            \ authenticated with an API key may set or change it; a call with a connected user's JWT answers 400."
          type: "string"
    TriggerSubscriptionStatus:
      description: "The status of a trigger subscription."
      type: "string"
      enum:
        - "ENABLED"
        - "DISABLED"
        - "CONNECTION_ERROR"
        - "FAILED"
