  /{externalUserId}/components/{componentName}/versions/{componentVersion}/actions/{actionName}:
    post:
      description: "Executes an action of a component and returns the result as the response."
      summary: "Executes an action of a component and returns the result as the response"
      tags:
        - "action"
      operationId: "executeAction"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "X-Instance-Id"
          in: header
          schema:
            type: integer
            format: int64
          example: 1234
          description: The integration instance Id that uniquely identifies the connected user's specific integration instance
          required: false
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentName"
          description: "The component name."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentVersion"
          description: "The component version."
          in: "path"
          required: true
          schema:
            type: "integer"
        - name: "actionName"
          description: "The name of the action to call."
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              required:
                - input
              properties:
                input:
                  description: The input parameters for the action.
                  type: object
                  additionalProperties: true
        required: true
      responses:
        "200":
          description: "The list of component action objects."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "499":
          $ref: "#/components/responses/remoteProviderError"
        "500":
          $ref: "#/components/responses/internalServerError"
        "501":
          $ref: "#/components/responses/notImplemented"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/components/{componentName}/versions/{componentVersion}/triggers:
    get:
      description: "Returns a list with all the available triggers for a given component. The call must be made for the\
        \ connected user in the path; a connected user's token for another user is rejected with 403."
      summary: "Returns a list with all the available triggers for a given component"
      tags:
        - "trigger-subscription"
      operationId: "getComponentTriggers"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentName"
          description: "The component name."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentVersion"
          description: "The component version."
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "The list of component trigger objects."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: '#/components/schemas/Trigger'
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/components/{componentName}/versions/{componentVersion}/triggers/{triggerName}/subscriptions:
    post:
      description: "Subscribes the connected user to a component trigger and returns the subscription. Trigger events\
        \ are delivered to the subscription webhook URL, or to the environment webhook URL when none is set. When\
        \ the trigger cannot be registered, the subscription is removed and the error response carries the error code\
        \ and no subscription id. When that removal fails too, it carries the id of the subscription that was kept\
        \ FAILED. While the call runs, the new subscription is listed as FAILED with no error. A connected user can\
        \ have at most bytechef.embedded.trigger-subscription.max-per-connected-user subscriptions per environment\
        \ (100 by default, 0 for no limit); beyond it the call answers 400. Only a call authenticated with an API key\
        \ may set webhookUrl."
      summary: "Subscribes the connected user to a component trigger"
      tags:
        - "trigger-subscription"
      operationId: "createTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "X-Instance-Id"
          in: header
          schema:
            type: integer
            format: int64
          example: 1234
          description: The integration instance Id that uniquely identifies the connected user's specific integration instance. It must belong to the connected user, otherwise the call is rejected with 403, and to an integration of the requested component in the requested environment, otherwise the call is rejected with 400 USER_INPUT_ERROR. When omitted, the first instance of the integration is used.
          required: false
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentName"
          description: "The component name."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "componentVersion"
          description: "The component version."
          in: "path"
          required: true
          schema:
            type: "integer"
        - name: "triggerName"
          description: "The name of the trigger to subscribe to."
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerSubscriptionRequest"
        required: true
      responses:
        "200":
          description: "The trigger subscription object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSubscription'
        "400":
          $ref: "#/components/responses/triggerSubscriptionBadRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "499":
          $ref: "#/components/responses/triggerSubscriptionFailed"
        "500":
          $ref: "#/components/responses/triggerSubscriptionInternalError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/tools:
    get:
      description: "Returns a list with all the available tools."
      summary: "Returns a list with all the available tools"
      tags:
        - "tool"
      operationId: "getTools"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "categories"
          description: "Filter by specific integration categories, depending on the integrations the user has connected."
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: "components"
          description: "Filter by specific components, depending on the integrations the user has connected."
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: "tools"
          description: "Filter by specific tools, depending on the integrations the user has connected."
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
      responses:
        "200":
          description: "The list of tool objects."
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/Tool"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "499":
          $ref: "#/components/responses/remoteProviderError"
        "500":
          $ref: "#/components/responses/internalServerError"
        "501":
          $ref: "#/components/responses/notImplemented"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
    post:
      description: "Executes a tool and returns the result as the response."
      summary: "Executes a tool and returns the result as the response"
      tags:
        - "tool"
      operationId: "executeTool"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "X-Instance-Id"
          in: header
          schema:
            type: integer
            format: int64
          example: 1234
          description: The integration instance Id that uniquely identifies the connected user's specific integration instance
          required: false
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              required:
                - name
                - parameters
              properties:
                name:
                  description: The name of the tool to call.
                  type: "string"
                parameters:
                  description: The input parameters for the tool.
                  type: object
                  additionalProperties: true
        required: true
      responses:
        "200":
          description: "The provider's response'."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "499":
          $ref: "#/components/responses/remoteProviderError"
        "500":
          $ref: "#/components/responses/internalServerError"
        "501":
          $ref: "#/components/responses/notImplemented"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/trigger-subscriptions:
    get:
      description: "Returns the connected user's trigger subscriptions."
      summary: "Returns the connected user's trigger subscriptions"
      tags:
        - "trigger-subscription"
      operationId: "getTriggerSubscriptions"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "The list of trigger subscription objects."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: '#/components/schemas/TriggerSubscription'
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/trigger-subscriptions/{id}:
    delete:
      description: "Unregisters the trigger and deletes the subscription."
      summary: "Deletes a trigger subscription"
      tags:
        - "trigger-subscription"
      operationId: "deleteTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "id"
          description: "The id of the trigger subscription."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "The subscription was deleted successfully."
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/triggerSubscriptionNotFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
    get:
      description: "Returns a single trigger subscription object."
      summary: "Returns a trigger subscription"
      tags:
        - "trigger-subscription"
      operationId: "getTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "id"
          description: "The id of the trigger subscription."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "The trigger subscription object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSubscription'
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/triggerSubscriptionNotFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
    put:
      description: "Replaces the input, name, external id and webhook URL of a trigger subscription; a field left out\
        \ is cleared. When the subscription is ENABLED, the trigger is unregistered, which stops running executions\
        \ of the subscription, and registered again with the new input. When the new configuration cannot be saved,\
        \ the previous trigger is registered again and the subscription stays ENABLED with its previous\
        \ configuration. When the old trigger cannot be unregistered, the previous trigger cannot be restored or the\
        \ new trigger cannot be registered, the subscription is left FAILED. In these cases the error response\
        \ carries the error code and the subscription id. A subscription in any other status keeps its status and is\
        \ not registered; enable it to register the trigger. A subscription whose integration instance is disabled or\
        \ was deleted cannot be updated. Only a call authenticated with an API key may change webhookUrl."
      summary: "Updates a trigger subscription"
      tags:
        - "trigger-subscription"
      operationId: "updateTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "id"
          description: "The id of the trigger subscription."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerSubscriptionRequest"
        required: true
      responses:
        "200":
          description: "The trigger subscription object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSubscription'
        "400":
          $ref: "#/components/responses/triggerSubscriptionBadRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/triggerSubscriptionNotFound"
        "499":
          $ref: "#/components/responses/triggerSubscriptionFailed"
        "500":
          $ref: "#/components/responses/triggerSubscriptionInternalError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/trigger-subscriptions/{id}/disable:
    post:
      description: "Unregisters the trigger and disables the subscription. Running executions of the subscription are\
        \ stopped."
      summary: "Disables a trigger subscription"
      tags:
        - "trigger-subscription"
      operationId: "disableTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "id"
          description: "The id of the trigger subscription."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "The subscription was disabled successfully."
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/triggerSubscriptionNotFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/trigger-subscriptions/{id}/enable:
    post:
      description: "Registers the trigger and enables the subscription. When the trigger cannot be registered, the\
        \ subscription is left FAILED and the error response carries the error code and the subscription id. A\
        \ subscription whose integration instance was disabled or deleted, or whose connected user is disabled,\
        \ cannot be enabled."
      summary: "Enables a trigger subscription"
      tags:
        - "trigger-subscription"
      operationId: "enableTriggerSubscription"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "id"
          description: "The id of the trigger subscription."
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "The subscription was enabled successfully."
        "400":
          $ref: "#/components/responses/triggerSubscriptionBadRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/triggerSubscriptionNotFound"
        "499":
          $ref: "#/components/responses/triggerSubscriptionFailed"
        "500":
          $ref: "#/components/responses/triggerSubscriptionInternalError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
  /{externalUserId}/external-invocations:
    get:
      description: "Returns a page of the connected user's external invocations: embedded MCP component and workflow\
        \ tool calls, executeAction calls, executeTool calls and trigger event deliveries (API_TRIGGER). Tool inputs and\
        \ outputs are not included."
      summary: "Returns a page of the connected user's external invocations"
      tags:
        - "external-invocation"
      operationId: "getExternalInvocationsPage"
      parameters:
        - name: "X-Environment"
          description: "The environment."
          in: "header"
          required: false
          schema:
            $ref: '#/components/schemas/Environment'
        - name: "externalUserId"
          description: "The external user id."
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "source"
          description: "Return only invocations made through this source."
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/ExternalInvocationSource"
        - name: "outcome"
          description: "Return only invocations with this outcome."
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/ExternalInvocationOutcome"
        - name: "startDate"
          description: "Return only invocations recorded at or after this instant."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "endDate"
          description: "Return only invocations recorded at or before this instant."
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "pageNumber"
          description: "The number of the page to return."
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
      responses:
        "200":
          description: "The page of external invocations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalInvocationPage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
        - jwtBearerAuth: [ ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    jwtBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    badRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    forbidden:
      description: Forbidden
      content:
       application/json:
         schema:
           type: object
           properties:
             errors:
               $ref: "#/components/schemas/Errors"
    internalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    notFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    notImplemented:
      description: Not implemented
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    remoteProviderError:
      description: Remote provider error
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
    triggerSubscriptionBadRequest:
      description: "The request is invalid. errors[].code is USER_INPUT_ERROR, or NO_TRIGGER on create when the\
        \ component, its version or the trigger does not exist. triggerSubscriptionId is set only when enabling or\
        \ updating an existing subscription found a required connection missing; validation errors carry no id and\
        \ change nothing."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TriggerSubscriptionFailure"
    triggerSubscriptionFailed:
      description: "The app failed while ByteChef registered or unregistered the trigger. errors[].code is API_ERROR,\
        \ TIMEOUT_ERROR or OAUTH_REFRESH and errors[].meta.origin is remote-provider. triggerSubscriptionId is set on\
        \ enable and update, and on create only when the failed subscription could not be removed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TriggerSubscriptionFailure"
    triggerSubscriptionInternalError:
      description: "ByteChef failed locally. errors[].code is INTERNAL_ERROR, errors[].meta.origin is bytechef and the\
        \ detail is a generic message; the cause is in the server log. triggerSubscriptionId is set when registering,\
        \ unregistering or redeploying the trigger of an existing subscription failed, and on create only when the\
        \ failed subscription could not be removed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TriggerSubscriptionFailure"
    triggerSubscriptionNotFound:
      description: "The trigger subscription does not exist, or does not belong to this connected user and environment.\
        \ errors[].code is NOT_FOUND."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TriggerSubscriptionFailure"
    unprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: "#/components/schemas/Errors"
