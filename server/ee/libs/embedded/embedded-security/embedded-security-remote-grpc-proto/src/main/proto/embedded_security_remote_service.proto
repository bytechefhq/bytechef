syntax = "proto3";

package bytechef.embedded.security.remote.v1;

option java_multiple_files = true;
option java_package = "com.bytechef.ee.embedded.security.remote.grpc.proto";

service SigningKeyRemoteService {
  rpc GetPublicKey(SigningKeyPublicKeyRequest) returns (PublicKeyResponse);
}

service JwtTokenRemoteService {
  rpc GetPublicKey(JwtPublicKeyRequest) returns (PublicKeyResponse);
}

message SigningKeyPublicKeyRequest {
  string key_id = 1;
  int64 environment_id = 2;
}

message JwtPublicKeyRequest {
  string key_id = 1;
}

message PublicKeyResponse {
  optional bytes encoded = 1;
}
