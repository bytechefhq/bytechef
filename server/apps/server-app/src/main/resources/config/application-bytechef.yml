bytechef:
  ai:
    auto-memory:
      # Auto-memory storage provider (AWS(EE) | FILESYSTEM | JDBC) default: JDBC
      provider: JDBC
    copilot:
      enabled: false
      # Default LLM provider of the Copilot when the user has not selected one; empty uses the catalog default
      provider:
    firecrawl:
      base-url: https://api.firecrawl.dev/v2
      enabled: false
    hub:
      # Whether the AI Hub is enabled
      enabled: false
    knowledge-base:
      enabled: false
      ocr:
        # OCR provider used when extracting text from knowledge base documents (AZURE | MISTRAL | NONE)
        provider: NONE
      # Number of concurrent consumers per knowledge base message route (used by AMQP | JMS brokers)
      subscriptions:
        document-chunk-update-events: 1
        document-process-events: 1
    mcp:
      server:
        # Whether the management MCP server is enabled
        enabled: true
    memory:
      aws:
        bucket-prefix: bytechef-chat-memory
        key-prefix: ""
        session-bucket-prefix: bytechef-session
      # Chat memory provider (AWS | IN_MEMORY | JDBC | REDIS)
      provider: JDBC
      redis:
        host: localhost
        port: 6379
        session-key-prefix: "bytechef-session:"
      session-max-archived-events: 1000
    provider:
      chat:
        anthropic:
          options:
            model: claude-sonnet-4-6
            temperature: 0.5
        deep-seek:
          options:
            model: deepseek-chat
        groq:
          options:
            model: llama-3.3-70b-versatile
        mistral:
          options:
            model: mistral-large-latest
        nvidia:
          options:
            model: meta/llama-3.1-70b-instruct
        openai:
          options:
            model: gpt-5.1
            temperature: 1
            reasoning-effect: MEDIUM
            verbosity: LOW
        perplexity:
          options:
            model: sonar
        vertex-gemini:
          options:
            model: gemini-2.5-pro
      embedding:
        mistral:
          options:
            model: mistral-embed
        openai:
          options:
            model: text-embedding-3-small
      image:
        openai:
          options:
            model: dall-e-3
    vectorstore:
      provider: PGVECTOR
      pgvector:
        dimensions: 1536
  analytics:
    enabled: false
  async:
    # Upper bound on concurrent @Async tasks on the default executor (mail, notifications, background work).
    # There is no queue: a submitter waits for a permit. Workflow task and trigger execution are bounded
    # separately by bytechef.worker.task.*.
    concurrency-limit: 200
  cache:
    # Cache provider (CAFFEINE) default: CAFFEINE
    provider: CAFFEINE
  cloud:
    # Cloud provider (AWS(EE) | NONE)
    provider: NONE
  coordinator:
    # Whether this instance runs the coordinator (orchestrates job and trigger execution)
    enabled: true
    task:
      # Number of concurrent consumers per coordinator task message route (used by AMQP | JMS brokers)
      subscriptions:
        application-events: 1
        resume-job-events: 1
        start-job-events: 1
        stop-job-events: 1
        task-execution-complete-events: 1
        task-execution-error-events: 1
    trigger:
      polling:
        # Trigger polling interval in minutes (default: 5)
        check-period: 5
      # Number of concurrent consumers per coordinator trigger message route (used by AMQP | JMS brokers)
      subscriptions:
        application-events: 1
        trigger-execution-complete-events: 1
        trigger-execution-error-events: 1
        trigger-listener-events: 1
        trigger-poll-events: 1
        trigger-webhook-events: 1
  data-storage:
    # Data storage provider (AWS(EE) | FILESYSTEM | JDBC) default: JDBC
    provider: JDBC
  datasource:
    # Maximum JDBC connections. Shared by Quartz's 10 job-store threads, workflow task execution and request
    # threads, so it must stay comfortably above Quartz's thread count on its own.
    maximum-pool-size: 30
  # Microservice discovery service provider. Possible value: REDIS.
  discovery-service:
    provider: REDIS
  # Edition (CE - Community Edition | EE - Enterprise Edition) default: EE
  edition: EE
  embedded:
    # Origins allowed to embed the Automation Hub, Workflow Builder and Integration Marketplace pages (EE), e.g.
    # https://app.example.com,https://admin.example.com. Empty lets any origin embed them.
    allowed-parent-origins: []
  # Encryption key provider (FILESYSTEM - the key generated on filesystem, PROPERTY - the key read from property) default: FILESYSTEM
  encryption:
    provider: FILESYSTEM
  # Enabled feature flags, e.g. [ff-123, ff-456]
  feature-flags: []
  file-storage:
    # File storage provider (AWS(EE) | FILESYSTEM | JDBC) default: FILESYSTEM
    provider: FILESYSTEM
    filesystem:
      basedir: ${user.home}/bytechef/data/file-storage
  help-hub:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bytechef
  mail:
    auth: false
    base-url: ${bytechef.public-url}
    debug: false
    from: noreply@app.bytechef.io
    host: localhost
    port: 25
    protocol: smtp
    ssl:
      enabled: false
    starttls:
      enable: false
      required: false
  message-broker:
    # Messaging provider between Coordinator and Workers (AMQP | AWS | JMS | KAFKA | MEMORY | REDIS)
    provider: MEMORY
    aws:
      # Transport for CONTROL routes, which must reach every node (REDIS | SQS) default: SQS
      # SQS: one shared queue, correct for a single node only. REDIS: pub/sub broadcast, required with more than one node.
      control-provider: SQS
  oauth2:
    authorization-server:
      enabled: false
#    predefinedApps:
#      mailchimp:
#        clientId: 123456789
#        clientSecret: 123456789
    redirect-uri: ${bytechef.public-url}/callback
  observability:
    logging:
      aws:
        # Sign OTLP log export requests with AWS SigV4 (CloudWatch OTLP endpoint https://logs.{region}.amazonaws.com/v1/logs).
        enabled: false
        # Existing CloudWatch log group and log stream the logs are written to; both are required when enabled
        log-group:
        log-stream:
        # region: derived from the endpoint host when not set
        service: logs
      enabled: false
      endpoint: http://localhost:4318/v1/logs
    metrics:
      enabled: false
      endpoint: http://localhost:4318/v1/metrics
    tracing:
      enabled: false
      endpoint: http://localhost:4318/v1/traces
  public-url:
  rabbitmq:
    host: localhost
    password: guest
    port: 5672
    username: guest
  redis:
    database: 0
    host: localhost
    password:
    port: 6379
    # Command timeout in milliseconds
    timeout: 60000
  resources:
    web: file:///opt/bytechef/client/
  scheduler:
    # Trigger scheduler provider (AWS(EE) | QUARTZ) default: QUARTZ
    provider: QUARTZ
    quartz:
      # Clustered mode: required when more than one coordinator runs (EE). default: false
      clustered: false
      # How often a clustered scheduler checks in, in milliseconds. default: 15000
      cluster-checkin-interval: 15000
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' https://*.command.ai data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.command.ai https://*.commandbar.com https://*.i.posthog.com https://cdn.jsdelivr.net https://storage.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://*.commandbar.com https://cdn.jsdelivr.net https://*.command.ai https://unpkg.com; img-src 'self' https://*.command.ai data:; font-src 'self' data:; media-src 'self' https://*.command.ai; connect-src 'self' https://*.command.ai https://*.i.posthog.com https://*.commandbar.com; worker-src blob: 'self';"
    social-login:
      enabled: false
      google:
        client-id:
        client-secret:
      github:
        client-id:
        client-secret:
    system:
      username: system_admin
      password:
    sso:
      enabled: false
    two-factor-authentication:
      enabled: false
  session:
    # HTTP session store (MEMORY | REDIS | JDBC) default: MEMORY
    # REDIS or JDBC share sessions between coordinators, so no sticky sessions are needed.
    store: MEMORY
  sign-up:
    activation-required: false
    enabled: true
  # Tenant support mode (SINGLE | MULTI - EE only) default: SINGLE
  tenant:
    mode: SINGLE
  user-guiding:
    container-id: 38U111210PF6ID
    enabled: false
  upgrade:
    enabled: true
  webhook:
    # Serve the public webhook endpoints (/webhooks, /callback, /approvals, /job/resume, /file-entries/{id}/content) on this node (true | false) default: true
    enabled: true
  webhook-url:
  # When the worker is enabled, subscribe to the default "default" queue with 10 concurrent consumers.
  # You may also route workflow tasks to other arbitrarily named task queues by specifying the "node"
  # property on any given task.
  # E.g. node: captions will route to the captions queue which a worker would subscribe to with workflow.worker.subscriptions.captions.
  # Note: queue must be created before tasks can be routed to it. ByteChef will create the queue if it isn't already there when the worker
  # bootstraps.
  worker:
    # Whether this instance runs the worker (executes workflow tasks and triggers)
    enabled: true
    task:
      # Per-route consumer concurrency for the AMQP/Kafka/Redis/JMS/SQS brokers; the memory broker ignores it.
      # `default` additionally caps concurrent task execution process-wide, so on a monolith this is simply
      # "max concurrent workflow tasks".
      subscriptions:
        default: 10
      # Concurrent executions in the synchronous, interactive lane (API Platform sync path, editor Test button),
      # kept separate so a burst of scheduled runs cannot leave an interactive caller waiting for a permit.
      sync-concurrency-limit: 5
  workflow:
    execution:
      agent:
        # Maximum nesting depth of sub-workflows called by AI agent tools default: 10
        max-subflow-depth: 10
    output-storage:
      # Output storage provider for workflow output data (AWS(EE) | FILESYSTEM | JDBC) default: JDBC
      provider: JDBC
    repository:
      # Workflow definition repositories (classpath | filesystem | git | jdbc); more than one may be enabled
      classpath:
        enabled: false
      filesystem:
        enabled: false
      git:
        enabled: false
      jdbc:
        enabled: true
    test-output:
      # Maximum number of items kept from each list in an output saved by Test Action in the workflow editor
      max-sample-items: 100
